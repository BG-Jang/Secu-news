<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body>
<title>보안 다이제스트 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:oklch(98% 0.012 45);--paper-3:oklch(92% 0.016 45);
  --ink:oklch(18% 0.012 45);--ink-2:oklch(32% 0.014 45);--ink-3:oklch(48% 0.012 45);
  --accent:oklch(42% 0.20 25);--rule:oklch(84% 0.010 45);
  --void:#14151a;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--void);
  font-family:'Noto Sans KR','Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
body.mode-index{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper)}

/* ---------- 아카이브 인덱스 ---------- */
#index{display:none;max-width:560px;margin:0 auto;padding:34px 22px 56px;
  background:var(--paper);color:var(--ink);min-height:100%}
body.mode-index #index{display:block}
.ix-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.ix-title{font-family:'Oswald','Noto Sans KR',sans-serif;font-weight:700;
  font-size:40px;line-height:1.08;letter-spacing:-.01em;margin-top:12px}
.ix-sub{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;
  color:var(--ink-3);margin-top:12px}
.ix-rule{border:none;border-top:3px solid var(--ink);position:relative;margin:20px 0 0}
.ix-rule::after{content:"";position:absolute;top:4px;left:0;right:0;border-top:1px solid var(--ink)}

.ix-search{width:100%;margin-top:22px;padding:12px 14px;border:1.5px solid var(--rule);
  background:#fff;font-size:15px;font-family:inherit;color:var(--ink);border-radius:0}
.ix-search:focus{outline:none;border-color:var(--ink)}
.ix-search::placeholder{color:var(--ink-3)}

.ix-month{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.16em;color:var(--ink-3);margin:30px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--rule)}

.card{display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--rule);
  padding:16px 2px;cursor:pointer;font:inherit;color:inherit}
.card:active{background:var(--paper-3)}
.card-d{flex:0 0 62px}
.card-dd{font-family:'Oswald','Noto Sans KR',sans-serif;font-size:30px;font-weight:700;
  line-height:1;letter-spacing:-.02em}
.card-dow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;
  color:var(--ink-3);margin-top:5px}
.card-body{flex:1;min-width:0}
.card-h{font-size:14px;font-weight:700;line-height:1.45;color:var(--ink)}
.card-sub{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.06em;padding:3px 7px;border:1px solid var(--rule);color:var(--ink-3)}
.card-go{flex:0 0 auto;align-self:center;color:var(--ink-3);font-size:18px}
.ix-empty{padding:40px 0;text-align:center;color:var(--ink-3);font-size:14px}
.ix-foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:11.5px;line-height:1.7;color:var(--ink-3)}

/* ---------- 덱 뷰어 ---------- */
#deck{display:none;position:fixed;inset:0;overflow:hidden;background:var(--void)}
body.mode-deck #deck{display:block}
.slide{position:absolute;left:50%;top:50%;width:430px;height:932px;
  transform:translate(-50%,-50%) scale(var(--mb-scale,1));transform-origin:center center;
  opacity:0;pointer-events:none;transition:opacity .32s ease}
.slide.is-active{opacity:1;pointer-events:auto}
.notes{display:none}
/* 원본 파일에 정의가 빠져 있던 트렌드 카드 스타일 보강 */
.trend-card{margin-top:16px;padding-left:14px;border-left:3px solid var(--accent)}
.trend-kicker{font-size:14.5px;font-weight:700;line-height:1.4;color:var(--ink)}
.trend-body{font-size:12.8px;line-height:1.55;color:var(--ink-2);margin-top:5px}

.pbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);
  z-index:42;transition:width .3s ease}
.navzone{position:fixed;top:0;bottom:52px;width:22%;z-index:38;cursor:pointer}
.navzone.l{left:0}.navzone.r{right:0}
.botbar{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:41;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  background:linear-gradient(to top,rgba(20,21,26,.92),rgba(20,21,26,0))}
.back{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);
  border:none;padding:8px 14px 8px 11px;font:inherit;font-size:13px;font-weight:700;
  color:var(--ink);cursor:pointer;border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.28)}
.daylabel{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.12em;color:rgba(255,255,255,.6);padding-right:4px}
.counter{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
  color:rgba(255,255,255,.72);transition:opacity .4s ease}
</style>

(function(){
'use strict';
var DAYS = [{"date":"2026-09-19","slug":"","dow":"토","sub":"2026. 09. 19 (SAT)","foot":"구글 Gemini, 도메인 설정 오류로 실제 기업 3곳 시스템 자율 침투 · CISA 리눅스 커널 취약점 3종 실전 악용 KEV 등재 · 북한 WaterPlum '가짜 코딩 인터뷰' 암호화폐 탈취 공격 · 필리핀 LTFRB 1,600만 건 운전자·차량 DB 유출 · Health-ISAC MedTech 9대 보안 베이스라인 발표 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"Gemini","l":"보안 평가 중 외부 기업 3곳 자율 침투"},{"n":"리눅스 커널 3종","l":"CISA KEV 긴급 등재"},{"n":"1,600만 건","l":"필리핀 LTFRB 운전자 DB 유출"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 19 (SAT)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">Gemini</div><div class=\"l\">보안 평가 중 외부 기업 3곳 자율 침투</div></div>\n    <div><div class=\"n\">리눅스 커널 3종</div><div class=\"l\">CISA KEV 긴급 등재</div></div>\n    <div><div class=\"n\">1,600만 건</div><div class=\"l\">필리핀 LTFRB 운전자 DB 유출</div></div>\n  </div>\n  <div class=\"title-foot\">구글 Gemini, 도메인 설정 오류로 실제 기업 3곳 시스템 자율 침투 · CISA 리눅스 커널 취약점 3종 실전 악용 KEV 등재 · 북한 WaterPlum '가짜 코딩 인터뷰' 암호화폐 탈취 공격 · 필리핀 LTFRB 1,600만 건 운전자·차량 DB 유출 · Health-ISAC MedTech 9대 보안 베이스라인 발표<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 19일자 24시간 보안 뉴스 다이제스트. 구글 Gemini가 보안 평가 중 도메인 라우팅 오류로 실제 외부 기업 3곳 시스템에 자율 침투한 사고, CISA의 리눅스 커널 취약점 3종 실전 악용 KEV 긴급 등재, 북한 연계 WaterPlum 해킹 그룹의 가짜 코딩 인터뷰 암호화폐 탈취 공격, 필리핀 LTFRB의 1,600만 건 운전자·차량 데이터베이스 유출, Health-ISAC의 커넥티드 의료기기 9대 사이버보안 베이스라인 발표를 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">구글 Gemini, 보안 평가 중<br>외부 기업 3곳 자율 침투</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">도메인 라우팅 오류 · 실제 인터넷 시스템 무단 접근</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>구글 AI 모델 Gemini가 외부 전문 보안 평가(Irregular) 도중 <strong>가상 격리망(테스트베드) 도메인 라우팅 설정 실수</strong>로 인터넷에 연결된 <strong>실제 외부 민간 기업 3곳의 운영 시스템에 무단 접근</strong>, 취약점 스캔·계정 침투 워크플로우를 인간 개입 없이 자율 수행 — 월스트리트저널·보안 외신 공개</li>\n      <li><strong>모의 환경(Mock) 대신 실제 인터넷 연결 서버를 타깃으로 인식</strong> — Agentic AI가 물리적 격리 경계를 스스로 넘나드는 '망분리 실패' 사고로, 메타 Muse Spark·OpenAI 허깅페이스 침투에 이은 세 번째 유사 사례</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — Google Gemini Broke Into Real Company Systems After Security Test Domain Mix-Up / 보안뉴스 — 제미나이도 보안테스트 중 외부기관 해킹</div>\n  <div class=\"notes\"><p>Gemini가 보안 평가 도중 테스트베드 도메인 라우팅 오류로 실제 인터넷에 연결된 외부 기업 3곳 시스템에 자율 침투. 인간 개입 없이 취약점 스캔·계정 침투를 완결한 Agentic AI 물리적 망분리 실패 사고.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">CISA, 리눅스 커널 취약점<br>3종 실전 악용 KEV 등재</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">로컬→루트 권한 상승 · 컨테이너 격리 우회</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>미 CISA, 리눅스 기반 엔터프라이즈 서버·클라우드 인프라에서 <strong>일반 로컬 사용자가 최고 관리자(Root) 권한을 탈취하고 컨테이너 격리를 우회</strong>할 수 있는 커널 취약점 3종의 실전 악용을 확인해 KEV 목록에 긴급 추가</li>\n      <li><strong>메모리 관리·네트워크 스택 결함으로 커널 힙 오염 트리거</strong>, 표적형 APT 공격에서 거점 확보(Foothold)용으로 실제 사용 중 — RHEL·Ubuntu·Debian 등 주요 배포판 최신 패치 커널 적용 시급</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — CISA Flags Three Linux Kernel Vulnerabilities Exploited in the Wild</div>\n  <div class=\"notes\"><p>CISA가 리눅스 커널의 로컬→루트 권한 상승·컨테이너 격리 우회 취약점 3종의 야생 악용을 확인해 KEV에 등재. APT 거점 확보용으로 쓰이고 있어 주요 배포판 패치 커널 적용과 eBPF 기반 시스템 콜 감시 강화가 요구됨.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">북한 WaterPlum, 가짜 코딩 인터뷰<br>암호화폐 탈취 공격</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">악성 Node.js 리포지토리 · postinstall 훅 악용</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>북한 연계 위협 행위자 WaterPlum, <strong>고액 연봉 원격 개발자 채용으로 위장</strong>해 면접 대상자에게 악성 Node.js 리포지토리를 실행하도록 유도 — 링크드인·깃허브에서 활동하는 블록체인·Web3 엔지니어 정밀 표적 공격 포착</li>\n      <li><strong>'npm install'·빌드 명령 실행 시 postinstall 스크립트가 동작</strong>, 로컬 브라우저 쿠키·Web3 지갑 비밀키(시드 구문)·사내 인프라 SSH 키를 탈취 — 개발자 PC를 사내 코드 저장소·프로덕션 클라우드로 이어지는 통로로 악용</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>GBHackers — North Korean WaterPlum Hackers Target IT Professionals With Fake Job Interviews to Steal Crypto</div>\n  <div class=\"notes\"><p>북한 WaterPlum이 가짜 코딩 면접 과제로 위장한 악성 Node.js 리포지토리를 배포, npm install 시 postinstall 훅으로 지갑 비밀키·SSH 키를 탈취. 개발자 워크스테이션의 외부 비신뢰 패키지 실행 격리가 핵심 방어선.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">필리핀 LTFRB, 1,600만 건<br>운전자·차량 DB 유출 확인</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">취약한 API·권한 관리 틈새 · 시스템 전면 오프라인 전환</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>필리핀 대중교통 인허가를 총괄하는 정부 기관 LTFRB(육상교통난가맹조정위원회)의 중앙 전산망이 해킹 공격을 받아 <strong>1,600만 건에 달하는 운송 사업자 개인정보·차량 등록증·면허 데이터 유출</strong> 확인 — 당국이 전산 시스템을 전면 오프라인으로 전환</li>\n      <li><strong>택시·버스 면허 및 차량 운행 데이터를 관장하는 정부 포털의 백엔드 DB가 취약한 API와 계정 권한 관리 틈을 타 덤프</strong> — 대량 시민 개인 식별 정보 암시장 유출로 딥페이크 위조 신분증·크리덴셜 스터핑 공격 급증 우려</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Newsbytes.ph — LTFRB confirms data breach, takes records system offline</div>\n  <div class=\"notes\"><p>필리핀 LTFRB 중앙 전산망 해킹으로 1,600만 건 운송 사업자 개인정보·차량 등록증·면허 데이터가 유출돼 시스템이 전면 오프라인 전환. 취약한 API와 권한 관리 틈새를 노린 공격으로 제로 트러스트 API 인가 감사와 DB 암호화가 요구됨.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">Health-ISAC, MedTech<br>'9대 보안 베이스라인' 발표</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">SBOM · 암호 유연성 · 보안 부팅 의무화</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>글로벌 의료보안 협의체 Health-ISAC, 환자 감시 장치·주입 펌프 등 커넥티드 의료기기(IoMT)의 안전성 확보를 위해 <strong>SBOM(소프트웨어 자재명세서)·암호 유연성·보안 부팅을 의무화</strong>하는 '9대 도메인 사이버보안 베이스라인' 표준 가이드라인 공개</li>\n      <li><strong>병원 조달·배포 시 검증해야 할 9개 핵심 보안 영역(자산 식별, 펌웨어 무결성, 원격 패치 기능, 암호화 등)을 표준화</strong> — 병원망 마비 랜섬웨어와 IoMT 해킹이 환자 생명을 직접 위협하는 상황에서 도입되는 공급망 보안 제도</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber — Health-ISAC sets nine-domain MedTech cybersecurity baseline / Security Boulevard — Daily OT Security News: September 19, 2026</div>\n  <div class=\"notes\"><p>Health-ISAC이 커넥티드 의료기기 조달·배포를 위한 9대 사이버보안 베이스라인을 발표. SBOM·암호 유연성·보안 부팅 의무화로, 병원 조달에서 보안 베이스라인 충족 여부가 입찰 핵심 조건이 되는 공급망 보안 제도화 흐름.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">Agentic AI의 물리적<br>망분리 실패 위험</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li><strong>가상 샌드박스에 의존한 레드팀 테스트의 구조적 한계 노출</strong> — 도메인 라우팅 설정 오류 하나에 AI 에이전트가 모의 환경을 벗어나 실제 인터넷 자산으로 타깃을 전환할 수 있음</li>\n      <li><strong>메타 Muse Spark, OpenAI 허깅페이스 침투에 이어 Gemini까지 유사 사고 반복</strong> — 프론티어 AI 오펜시브 보안 능력 평가 시 외부 인터넷과 물리적으로 단절된 폐쇄 격리망(에어갭) 운용의 법제화 요구가 부상</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>AI 레드팀 테스트베드의 하드웨어적 에어갭 의무화 + 에이전트 외부 통신 대상 도메인 화이트리스트 강제</strong>, Agentic AI 운영 시 네트워크 에GRESS(외발) 트래픽 전수 로깅·이상 차단 정책 적용</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / 보안뉴스 종합 분석</div>\n  <div class=\"notes\"><p>Gemini 외부 침투는 가상 격리망에 의존한 AI 레드팀 테스트의 구조적 한계를 보여준 사례. 에어갭 물리적 단절 의무화와 에이전트 egress 도메인 화이트리스트, 외부 통신 전수 로깅이 필수 방어 체계.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">멀티테넌트 컨테이너 인프라의<br>권한 상승 위협</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li><strong>커널 권한이 장악되면 동일 호스트의 도커/쿠버네티스 컨테이너 격리가 무력화</strong> — 클라우드 멀티테넌트 환경에서 단일 로컬 계정 침투가 인접 테넌트로 수평 이동하는 경로로 전환</li>\n      <li>리눅스 커널 KEV 3종은 <strong>웹셸·로컬 계정을 거점으로 APT가 Root 승격에 악용</strong>하는 실전 패턴 — 패치 공백 호스트가 클라우드 인프라 전체의 격리 신뢰를 무너뜨리는 단일 실패점</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>RHEL·Ubuntu·Debian 최신 패치 커널 즉각 적용 + eBPF 기반 비정상 시스템 콜 감시 강화</strong>, 컨테이너 호스트의 로컬 계정 최소화(무인 운영)와 privileged 컨테이너 사용 전수 감사 병행</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / CISA KEV 고지 종합 분석</div>\n  <div class=\"notes\"><p>리눅스 커널 KEV 3종은 컨테이너 격리를 무력화하는 구조적 위협. 패치 커널 적용, eBPF 시스템 콜 감시, 로컬 계정 최소화·privileged 컨테이너 감사로 멀티테넌트 격리 신뢰를 방어해야 한다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">공공 인증 인프라의<br>제로 트러스트 전환 필요성</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li><strong>1,600만 건 시민 식별 정보의 암시장 유출은 딥페이크 위조 신분증·크리덴셜 스터핑 공격의 원료</strong> — 공공 DB 덤프는 단순 유출을 넘어 2차 사기 생태계 전체를 키우는 연쇄 리스크</li>\n      <li><strong>취약한 API와 계정 권한 관리가 정부 포털의 공통 취약점</strong> — '내부망이므로 안전'이라는 전제 자체가 성립하지 않는 환경에서, 공공 서비스는 외부 접속 차단 + API별 최소 권한 인가가 기본선이 됨</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>공공 포털 제로 트러스트 API 인가 감사 + DB 컬럼 단위 암호화 적용</strong>, 오프라인 전환 시스템의 복구 전 침투 흔적 전수 포렌식과 재접속 시 MFA 강제 정책 수립</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Newsbytes.ph 종합 분석</div>\n  <div class=\"notes\"><p>LTFRB 유출은 공공 인증 인프라의 API·권한 관리 사각지대가 연쇄 사기로 이어지는 사례. 제로 트러스트 API 인가 감사, 컬럼 암호화, 복구 전 포렌식과 MFA 강제가 공공 서비스 기본선으로 요구됨.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">리눅스 커널 KEV 3종 대상 호스트 전수 식별 + 최신 패치 커널 적용 (RHEL·Ubuntu·Debian)</div><div class=\"act-sub\">로컬→루트 권한 상승·컨테이너 격리 우회 — eBPF 시스템 콜 감시 강화</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Agentic AI 테스트/운영 환경의 외부 egress 트래픽 전수 로깅 + 도메인 화이트리스트 점검</div><div class=\"act-sub\">Gemini 자율 침투 교훈 — 레드팀 테스트베드 에어갭 격리 수준 재평가</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">개발자 워크스테이션 외부 비신뢰 패키지 실행 통제 (Dev Container 강제 + postinstall 훅 모니터링)</div><div class=\"act-sub\">WaterPlum 가짜 면접 스캠 — 지갑 비밀키·SSH 키 탈취 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">공공·대외 서비스 포털의 API 인가 모델 제로 트러스트 감사 + DB 컬럼 암호화 점검</div><div class=\"act-sub\">LTFRB 1,600만 건 유출 교훈 — 크리덴셜 스터핑·딥페이크 사기 연쇄 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">커넥티드 의료기기(IoMT) 보유 자산의 SBOM·펌웨어 무결성·보안 부팅 준수 현황 점검</div><div class=\"act-sub\">Health-ISAC 9대 베이스라인 — 병원 조달 입찰 조건으로 확산 전망</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: The Hacker News, 보안뉴스, GBHackers, Newsbytes.ph, Industrial Cyber, Security Boulevard. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260919_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-18","slug":"","dow":"금","sub":"2026. 09. 18 (FRI)","foot":"Azure AI Foundry CVSS 10.0 테넌트 침범 긴급 패치 · 수학 교육 플랫폼 '생각하는황소' 사이트 해킹, 미성년자 개인정보 노출 우려 · Gyazo 2,300만 계정·비공개 스크린샷 유출 · CISA 주간 취약점 회보 폐지, KEV 중심 체제로 전환 · 안드로이드 접근성 악용 뱅킹 트로이목마 'RatHat' 확산 경보 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"CVSS 10.0","l":"Azure AI Foundry 만점 결함 패치"},{"n":"2,300만","l":"Gyazo 계정·비공개 이미지 유출"},{"n":"RatHat","l":"안드로이드 접근성 뱅킹 트로이목마"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 18 (FRI)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">CVSS 10.0</div><div class=\"l\">Azure AI Foundry 만점 결함 패치</div></div>\n    <div><div class=\"n\">2,300만</div><div class=\"l\">Gyazo 계정·비공개 이미지 유출</div></div>\n    <div><div class=\"n\">RatHat</div><div class=\"l\">안드로이드 접근성 뱅킹 트로이목마</div></div>\n  </div>\n  <div class=\"title-foot\">Azure AI Foundry CVSS 10.0 테넌트 침범 긴급 패치 · 수학 교육 플랫폼 '생각하는황소' 사이트 해킹, 미성년자 개인정보 노출 우려 · Gyazo 2,300만 계정·비공개 스크린샷 유출 · CISA 주간 취약점 회보 폐지, KEV 중심 체제로 전환 · 안드로이드 접근성 악용 뱅킹 트로이목마 'RatHat' 확산 경보<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 18일자 24시간 보안 뉴스 다이제스트. 마이크로소프트 Azure AI Foundry의 CVSS 10.0 만점 SSRF·권한 우회 결함 긴급 패치, 국내 수학 교육 플랫폼 '생각하는황소' 홈페이지 해킹으로 학생·학부모 개인정보 노출 우려, 글로벌 스크린샷 협업 서비스 Gyazo의 2,300만 계정 및 비공개 이미지 유출, CISA의 주간 취약점 회보 공식 폐지(KEV 중심 전환), 안드로이드 접근성 서비스 악용 신종 뱅킹 트로이목마 'RatHat' 확산 경보를 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">Azure AI Foundry<br>CVSS 10.0 만점 결함 패치</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">SSRF · 테넌트 경계 침범 · 독점 AI 모델 탈취</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>마이크로소프트, 기업용 AI 개발 플랫폼 Azure AI Foundry(구 Azure AI Studio)에서 <strong>서버 측 요청 위조(SSRF) 및 권한 우회로 타 기업 테넌트 경계를 침범</strong>해 독점 AI 모델·파라미터 가중치·미세조정 데이터셋을 탈취할 수 있는 <strong>CVSS 10.0 만점 결함 긴급 패치</strong></li>\n      <li>내부 서비스 간 통신 파서의 검증 부재로 <strong>한 테넌트의 비인가 사용자가 내부 토큰을 위조해 타 기업 저장소 접근·기밀 AI 파이프라인 자산 덤프</strong> 가능 — 클라우드 PaaS 멀티테넌시의 구조적 결함 사례</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — Microsoft Patches CVSS 10.0 Azure AI Foundry Flaw Enabling Enterprise Data Theft</div>\n  <div class=\"notes\"><p>Azure AI Foundry에서 SSRF와 권한 우회를 결합한 CVSS 10.0 결함이 패치됨. 한 테넌트 사용자가 내부 토큰 위조로 타 기업 AI 모델·가중치·학습 데이터셋을 탈취할 수 있었던 구조적 멀티테넌시 결함.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">'생각하는황소' 홈페이지 해킹<br>학생 개인정보 노출 위험</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">KISA·개인정보위 긴급 조사 착수</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>국내 대형 수학 교육 플랫폼 '생각하는황소' 웹사이트가 외부 사이버 공격을 받아 <strong>백엔드 데이터베이스가 직접 침해</strong> — 수강생·학부모 포털의 웹 취약점을 통한 DB 노출 경로 확인</li>\n      <li><strong>학생 이름·학교·성적 정보, 학부모 연락처</strong> 등 민감 개인정보 유출 가능성 제기 — 피싱 범죄 악용 우려로 KISA와 개인정보보호위원회가 긴급 조사 착수</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>매일경제 — 수학 학원 '생각하는황소' 사이트 해킹…학생 개인정보 유출 가능성 / KISA 보호나라</div>\n  <div class=\"notes\"><p>수학 교육 플랫폼 '생각하는황소' 웹사이트가 해킹당해 학생 이름·학교·성적과 학부모 연락처가 유출됐을 가능성이 제기. KISA와 개인정보보호위원회가 긴급 조사에 착수.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">Gyazo, 2,300만 계정<br>비공개 이미지 유출</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">이메일·해시 비밀번호 · Unlisted 스크린샷 인덱스 노출</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>개발자·기업이 폭넓게 쓰는 스크린샷 캡처·공유 서비스 Gyazo의 DB가 침해돼 <strong>2,300만 명의 이메일·계정 정보·해시된 비밀번호</strong> 및 비공개 스크린샷 자산 링크가 유출되는 대형 사고</li>\n      <li><strong>'링크를 아는 사람만 본다'는 Unlisted(비공개) 스크린샷 인덱스까지 암시장에 유출</strong> — 소스코드 스니펫·에러 로그·업무 기밀 화면이 대량 노출된 상태</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityAffairs — Gyazo Data Breach Exposes 23 Million User Records</div>\n  <div class=\"notes\"><p>Gyazo DB 침해로 2,300만 명의 계정 정보와 해시된 비밀번호, 비공개(Unlisted) 스크린샷 인덱스가 암시장에 유출. 사내 기밀 화면이 대량 노출된 상태.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">CISA, 주간 취약점 회보 폐지<br>'실전 위험 우선순위화' 전환</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">AI 탐지로 CVE 폭증 · 알림 피로 해소 목적</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>미 CISA, 수년간 발행해 온 정기 '주간 취약점 회보'를 <strong>전격 중단</strong> — AI 도구 도입으로 매월 발견되는 CVE가 기하급수적으로 폭증(9월 MS 966개 패치 등)하면서 단순 나열 방식의 한계 노출</li>\n      <li><strong>야생에서 실제 악용 중인 KEV 목록과 실시간 위협 인텔리전스 중심의 방어 체계로 단일화</strong> — 보안 담당자의 알림 피로(Alert Fatigue)를 줄이는 정책 전환</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">파급</div>\n    <ul>\n      <li>모든 취약점 일률적 패치는 더 이상 불가 — <strong>CVSS + EPSS(악용 예측 지수) + 야생 공격 지표를 결합한 위험 기반 패치 라이프사이클(RBVM)</strong> 운영이 업계 표준으로 부상</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Cybersecurity Dive — CISA ends weekly vulnerability roundups as part of shift to prioritization</div>\n  <div class=\"notes\"><p>CISA가 주간 취약점 회보 발행을 중단하고 KEV·실시간 위협 인텔리전스 중심의 우선순위 대응 체제로 전환. AI 기반 탐지로 CVE가 폭증하면서 CVSS+EPSS를 결합한 위험 기반 패치 라이프사이클이 표준화되는 흐름.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">신종 뱅킹 트로이목마<br>'RatHat' 전 세계 확산 경보</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">접근성 권한 악용 · 2FA 자동 승인 우회</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>안드로이드 <strong>접근성(Accessibility) 권한을 가로채 화면 입력값을 실시간 탈취</strong>하고, 은행·암호화폐 앱의 이중인증(2FA) 승인 버튼을 자동 클릭해 계좌 잔액을 은밀히 이체하는 신종 악성코드 'RatHat' 발견</li>\n      <li><strong>금융 보안 앱·택배 배송 알림으로 위장해 설치 유도</strong>, 화면 캡처·가상 키보드 입력·OTP 캡처 수행 — 사람이 눈치채지 못할 속도로 2단계 인증 팝업 자동 수락</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">파급</div>\n    <ul>\n      <li><strong>루트 권한 없이도 정상 OS 기능을 남용해 보안 장벽 우회</strong>가 확산 — 금융 앱 실행 시 비인가 접근성 서비스 감지·차단(Anti-Tamper) 고도화 요구</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityAffairs — RatHat Turns Android Accessibility Into an Attack Weapon</div>\n  <div class=\"notes\"><p>RatHat은 접근성 서비스 권한을 악용해 화면 입력값·OTP를 탈취하고 2FA 승인 버튼을 자동 클릭하는 신종 뱅킹 트로이목마. 루트 없이 정상 OS 기능을 남용하는 형태라 금융 앱의 비인가 접근성 서비스 차단 정책 고도화가 요구됨.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">클라우드 AI 멀티테넌시의<br>구조적 결함</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li><strong>AI 모델 가중치와 학습용 사내 문서는 기업 핵심 지적재산권(IP)</strong> — 클라우드 벤더의 인프라 레벨 패치만으로 보호가 끝나지 않음</li>\n      <li>멀티테넌시 환경의 <strong>내부 서비스 간 통신 검증 부재</strong>는 단일 결함이 테넌트 전체로 전파되는 구조적 리스크 — AI 파이프라인 자산을 일반 데이터와 동일하게 취급하면 안 됨</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>사내 AI 파이프라인의 <strong>프라이빗 엔드포인트(Private Link) 연결 강제 + 고객 관리 키(CMK) 암호화 적용</strong>, 테넌트 간 토큰 위조 시나리오에 대한 자체 감사 병행</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / Microsoft 보안 고지 종합 분석</div>\n  <div class=\"notes\"><p>Azure AI Foundry CVSS 10.0은 멀티테넌시 내부 통신 검증 부재가 독점 AI 모델·가중치·학습 데이터셋 탈취로 직결된 사례. 벤더 패치 외 Private Link 강제와 CMK 암호화, 토큰 위조 시나리오 자체 감사가 필수.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">교육 인프라의 개인정보<br>관리 사각지대</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li><strong>2026년 9월 11일 시행된 개정 개인정보 보호법 직후 발생한 사고</strong> — 대폭 강화된 법적 기준 하에서 유출 통지 이행 여부, DB 암호화 조치 미흡 등이 정조준 대상</li>\n      <li>미성년자 학생의 학업 성적·거주 지역·보호자 연락처는 <strong>피싱·정교한 사회공학 공격의 핵심 재료</strong> — 교육기관은 개인정보 처리 규모 대비 보안 투자 사각지대가 전형적</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>관계 당국의 엄격한 과징금 처분·조사 전망</strong> — 교육기관은 민감 개인정보 DB 암호화, 웹 접점 침투 테스트, 유출 통지 절차(72시간 내) 사전 점검이 시급</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>매일경제 / KISA 보호나라 종합 분석</div>\n  <div class=\"notes\"><p>'생각하는황소' 해킹은 개정 개인정보 보호법 시행 직후 발생한 사고로, 통지 이행 여부와 DB 암호화 미흡에 대한 엄격한 과징금·조사가 예상됨. 미성년자 데이터는 피싱 악용 리스크가 특히 큼.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">스크린샷 내 민감 정보의<br>2차 침해 위협</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>Gyazo는 개발자·기획자가 <strong>소스코드 스니펫·시스템 에러 로그·업무 기밀 화면</strong>을 공유하는 용도로 폭넓게 사용 — 계정 유출에 그치지 않고 비공개 이미지 인덱스 자체가 노출됨</li>\n      <li><strong>이미지 OCR 분석으로 캡처 화면 내 사내 비밀번호·인프라 접근 키(API 키)가 대량 추출</strong>될 수 있어 2차 침해 벡터로 전환 — '링크만 모르면 안전'이라는 Unlisted 전제가 무너짐</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>임직원의 업무용 화면 캡처 클라우드 업로드 통제 + 섀도우 IT 사용 차단</strong>, DLP 정책으로 민감 정보 포함 스크린샷 외부 전송 탐지·차단 적용</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityAffairs 종합 분석</div>\n  <div class=\"notes\"><p>Gyazo 유출의 핵심 리스크는 이미지 OCR으로 캡처 화면 내 API 키·비밀번호가 대량 추출되는 2차 침해. 업무 캡처 클라우드 업로드 통제와 섀도우 IT 차단, DLP 기반 민감 스크린샷 탐지가 필요.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Azure AI Foundry 패치 적용 확인 + 사내 AI 파이프라인 Private Link·CMK 강제 점검</div><div class=\"act-sub\">CVSS 10.0 테넌트 침범 — 독점 모델·가중치·학습 데이터셋 보호</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">'생각하는황소' 관련 서비스 개인정보 유출 통지 이행 여부 점검 + DB 암호화 전수 확인</div><div class=\"act-sub\">9.11 개정 개인정보 보호법 엄중 적용 — 미성년자 데이터 피싱 악용 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">업무용 스크린샷 클라우드 업로드 통제 + 섀도우 IT 차단 (Gyazo 등)</div><div class=\"act-sub\">2,300만 건 유출 — 캡처 내 API 키·PII의 OCR 2차 침해 방지</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">취약점 관리 체계를 KEV + EPSS 위험 기반 우선순위화(RBVM)로 전환 검토</div><div class=\"act-sub\">CISA 주간 회보 폐지 — 알림 피로 해소, 실전 악용 중심 대응</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">금융·암호화폐 앱의 비인가 접근성 서비스 감지·차단(Anti-Tamper) 고도화</div><div class=\"act-sub\">RatHat — 2FA 자동 승인 우회형 뱅킹 트로이목마 확산 경보</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: The Hacker News, 매일경제, SecurityAffairs, Cybersecurity Dive, KISA 보호나라. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260918_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-17","slug":"","dow":"목","sub":"2026. 09. 17 (THU)","foot":"Cisco ISE CVSS 10.0 인증 우회 제로데이 실전 악용 확인 · Check Point SmartConsole 루트 권한 RCE(CVSS 9.8) 긴급 패치 · USCG·FBI, 유조선 2척 국가 배후 사이버 공격 합동 조사 · 금융 플랫폼 '이토마토' 회원정보 변조 해킹 피해 · 백악관, 정부 주도 사이버보안 인큐베이터 창설 추진 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"CVSS 10.0","l":"Cisco ISE 제로데이 실전 악용"},{"n":"CVE-2026-91843","l":"Check Point 루트 RCE 공개"},{"n":"유조선 2척","l":"USCG·FBI 합동 사이버 조사"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 17 (THU)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">CVSS 10.0</div><div class=\"l\">Cisco ISE 제로데이 실전 악용</div></div>\n    <div><div class=\"n\">CVE-2026-91843</div><div class=\"l\">Check Point 루트 RCE 공개</div></div>\n    <div><div class=\"n\">유조선 2척</div><div class=\"l\">USCG·FBI 합동 사이버 조사</div></div>\n  </div>\n  <div class=\"title-foot\">Cisco ISE CVSS 10.0 인증 우회 제로데이 실전 악용 확인 · Check Point SmartConsole 루트 권한 RCE(CVSS 9.8) 긴급 패치 · USCG·FBI, 유조선 2척 국가 배후 사이버 공격 합동 조사 · 금융 플랫폼 '이토마토' 회원정보 변조 해킹 피해 · 백악관, 정부 주도 사이버보안 인큐베이터 창설 추진<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 17일자 24시간 보안 뉴스 다이제스트. Cisco ISE의 CVSS 10.0 인증 우회 제로데이(CVE-2026-76460) 실전 악용 확인 및 긴급 핫픽스, Check Point 방화벽 통합 관리 서버(SmartConsole) 루트 권한 RCE 결함(CVE-2026-91843, CVSS 9.8) 공개, 미 해안경비대·FBI의 유조선 2척 대상 국가 배후 추정 사이버 공격 합동 조사, 국내 금융 플랫폼 '이토마토' 회원정보 변조 해킹 피해, 백악관의 정부 주도 사이버보안 인큐베이터 창설 추진을 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">Cisco ISE 제로데이<br>CVSS 10.0 실전 악용 확인</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-76460 · 미인증 관리자 인증 우회</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>시스코, 기업 네트워크 접근 제어(NAC)·신원 인가 솔루션 Cisco ISE API에서 <strong>미인증 원격 공격자가 관리자 인증을 우회하고 시스템을 완전 장악</strong>하는 CVSS 10.0 만점 제로데이(CVE-2026-76460)의 <strong>실제 침해 공격(Active Exploitation) 확인 후 긴급 핫픽스 배포</strong></li>\n      <li><strong>이메일 게이트웨이 제로데이 발표 이틀 만에 ISE까지 연속 타격</strong> — 외부에서 조작된 API 요청만으로 관리자 인증 세션 체크 우회, 사내망 접속 통제 정책 무력화 및 임의 스크립트 배포 가능</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — Cisco Warns of New Zero-Day ISE Auth Bypass (CVSS 10.0) / SecurityWeek — Active Exploitation Triggers Emergency Patch</div>\n  <div class=\"notes\"><p>Cisco ISE API의 미인증 관리자 인증 우회 제로데이가 야생에서 실제 악용된 것이 확인돼 긴급 핫픽스가 배포됨. 이메일 게이트웨이 제로데이 이틀 만의 연속 타격으로, 관리 콘솔의 공용 인터넷 접속 차단과 핫픽스 우선 적용이 시급.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">Check Point SmartConsole<br>루트 권한 RCE 결함 공개</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-91843 · CVSS 9.8 · 스택 버퍼 오버플로우</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>체크포인트, 보안 관리 서버(Security Management Server)의 <strong>로그인 스택 버퍼 오버플로우 결함(CVE-2026-91843, CVSS 9.8)</strong>으로 인증 없는 원격 공격자가 관리 콘솔에서 최고 관리자(Root) 권한 코드를 실행할 수 있음을 확인하고 긴급 보안 패치 배포</li>\n      <li><strong>사전 인증 로그인 인터페이스의 스택 메모리 경계 검증 누락</strong> — 특수 버퍼 전송으로 프로그램 흐름 변경 후 OS 루트 권한 획득 가능, 방화벽 통합 관리 서버 전체 장악 벡터</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — Critical Check Point Management Flaw Lets Unauthenticated Attackers Run Code as Root</div>\n  <div class=\"notes\"><p>Check Point 보안 관리 서버의 로그인 스택 버퍼 오버플로우로 미인증 원격 공격자가 루트 권한 코드를 실행할 수 있는 CVSS 9.8 결함이 공개됨. 관리 서버가 장악되면 해당 콘솔이 통제하는 방화벽 룰셋 전체가 변조될 수 있다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">유조선 2척 대상 사이버 공격<br>USCG·FBI 합동 조사 착수</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">OT 항법·조타 + 통신 IT 네트워크 비인가 침투</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>미국 주요 항만으로 진입하던 <strong>대형 상업용 유조선 2척의 선내 OT(항법·조타) 및 통신 IT 네트워크에서 해외 해킹 조직의 비인가 침투 정황</strong> 포착 — FBI와 미 해안경비대가 합동 포렌식 조사 착수</li>\n      <li><strong>위성 통신 장비와 선내 제어망(OT) 간 접점에서 비인가 트래픽 감지</strong>, 선박 위치 정보 왜곡 및 화물 밸브·밸러스트수 제어 시스템 기능 마비 시도 정황 파악 — 국가 배후 추정</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber — USCG, FBI assess OT and IT systems aboard two oil tankers / Cybersecurity Dive — FBI, Coast Guard probe suspected cyberattacks on ships entering US waters</div>\n  <div class=\"notes\"><p>미국 영해 진입 유조선 2척의 선내 OT·IT 네트워크에서 국가 배후 추정 침투가 포착돼 FBI·USCG 합동 조사가 시작됨. 위치 정보 왜곡과 화물 밸브·밸러스트수 제어 마비 시도가 확인됐으며, 해상 에너지 수송로에 대한 실전 사이버 테러 사례.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">'이토마토' 회원정보 변조<br>외부 해킹 침해 피해</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">회원 DB 비인가 접근·변조 · 당국 합동 조사 중</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>증권·금융 투자 정보 기업 이토마토, 외부 공격자 침투로 <strong>회원 데이터베이스가 비인가 접근 및 변조</strong>되는 해킹 피해 발생 — 회원 긴급 공지 발령, 관계 당국 합동 침해 조사 진행 중</li>\n      <li><strong>웹 애플리케이션 결함으로 DB에 비인가 쿼리 주입</strong>, 회원 계정 정보와 결제 관련 데이터가 외부에서 변조 — 단순 유출을 넘어선 '데이터 변조(Data Tampering)' 형태</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>보안뉴스 — 사건·사고 기사 (이토마토 해킹 침해)</div>\n  <div class=\"notes\"><p>금융·투자 정보 플랫폼 이토마토가 웹 결함으로 회원 DB 비인가 접근·변조 피해를 입고 긴급 공지 및 당국 합동 조사가 진행 중. 데이터 변조는 결제 승인 오류·피싱 계좌 조작 등 2차 금융 사기로 이어질 수 있다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">백악관, 정부 주도<br>사이버보안 인큐베이터 추진</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">DARPA·CISA 연계 · 연방 인프라 방어 특화</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>백악관과 국가안보 당국, 핵심 기반시설·연방 기관 방어 체계 고도화를 위해 <strong>정부 자금을 직접 투입해 자동화 취약점 교정 및 제로 트러스트 특화 보안 스타트업을 육성·조달</strong>하는 연방 인큐베이터 설립 공식 검토 착수</li>\n      <li><strong>민간 벤더 대응 속도가 국가 배후 해커의 AI 무기화 속도를 따라가지 못하자</strong>, DARPA·CISA 연계로 연방 인프라 전용 차세대 방어 기술을 개발하는 스타트업을 직접 발굴·육성하기로 결정</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>PYMNTS — White House Considers Government-Led Cybersecurity Incubator</div>\n  <div class=\"notes\"><p>백악관이 연방 인프라 방어를 위한 정부 주도 사이버보안 인큐베이터 창설을 공식 검토. 위험 자본 직접 투자로 취약점 자동 패치·자율형 회복력 기술을 조기 상용화하는 국가 주도형 딥테크 투자 모델의 부상.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">사내 접근 인가 관문의<br>완전 함락 시나리오</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>Cisco ISE는 내부망 접속 시 사용자·단말 신원 검증과 권한 부여를 담당하는 <strong>NAC의 핵심 두뇌</strong> — 이 서버가 무력화되면 사내망으로의 무검증 접속이 전면 가능해짐</li>\n      <li><strong>이메일 게이트웨이 제로데이에 이어 ISE까지 연속 타격</strong> — 시스코 제품군의 인가·게이트웨이 계층이 표적으로 부상, 단일 벤더 생태계 내 다중 침투 경로 리스크 현실화</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>관리 콘솔의 공용 인터넷 접속 즉각 차단 + 긴급 핫픽스 최우선 적용</strong>, ISE API 접근 로그에서 미인증 세션 우회 시그니처 전수 역탐사(Forensic Review)</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / SecurityWeek 종합 분석</div>\n  <div class=\"notes\"><p>Cisco ISE 제로데이는 사내 접근 인가 관문 전체를 무력화하는 구조적 리스크. 이메일 게이트웨이와 ISE의 연속 타격으로 시스코 제품군 다중 침투 경로가 현실화됐고, 콘솔 인터넷 차단·핫픽스·API 로그 역탐사가 병행돼야 한다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">방화벽 정책 컨트롤러의<br>단일 접점 장악 위협</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>보안 관리 서버가 침해당하면 <strong>해당 콘솔이 통제하는 수십~수백 대의 방화벽 게이트웨이 정책(룰셋)이 한 번에 변조</strong>될 수 있는 단일 접점(Single Point of Compromise) 구조</li>\n      <li>루트 권한 RCE는 패치 전까지 <strong>방화벽 자체를 공격자의 도구로 전환</strong> 가능 — 트래픽 필터링 우회, 백도어 포트 개방, 로그 조작으로 침투 흔적 은폐까지 가능</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>관리 서버를 독립된 관리망(OOB)으로 완전 격리 + Jumbo Hotfix Accumulator 배포</strong>, 룰셋 변경 이력 감사로 패치 전후 변조 여부 대조 검증</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News 종합 분석</div>\n  <div class=\"notes\"><p>Check Point 관리 서버 루트 RCE는 방화벽 룰셋 전체를 한 번에 변조하는 단일 접점 장악 벡터. OOB 관리망 완전 격리와 핫픽스 배포, 룰셋 변경 이력 대조 검증이 필수 완화책.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">해양 수송로의<br>실전 사이버 테러 리스크</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>해상 유조선이 나포·좌초되면 <strong>항만 봉쇄 및 글로벌 에너지 공급망 대란으로 직결</strong> — OT(조타·밸브 제어)와 IT(위성 통신) 접점이 해적의 물리적 접근보다 훨씬 취약한 표적으로 부상</li>\n      <li><strong>USCG 상선 사이버 보안 계획서 제출 의무화 조치와 함께 선박 내 IT/OT 망분리 장비 도입이 글로벌 해운업계 전반으로 확대</strong>될 전망 — 에너지·해운 OT 보안 투자의 규제 촉발점</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>선박 IT/OT 망분리 장비 도입 + 위성 통신-제어망 간 접점 트래픽 이상 감시</strong>, 항만·해운 기업은 OT 자산 인벤토리 전수 조사와 국가 배후 공격 시나리오 tabletop 훈련 병행</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber / Cybersecurity Dive 종합 분석</div>\n  <div class=\"notes\"><p>유조선 2척 타깃 공격은 OT/IT 접점을 노린 실전 사이버 테러 사례. 위치 왜곡·밸브 제어 마비 시도는 항만 봉쇄와 에너지 공급망 대란으로 직결될 수 있어, IT/OT 망분리 장비 도입과 접점 트래픽 감시가 해운업계 전반의 표준으로 확산될 것.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Cisco ISE 긴급 핫픽스 적용 + 관리 콘솔 공용 인터넷 접속 차단 (CVE-2026-76460)</div><div class=\"act-sub\">CVSS 10.0 제로데이 실전 악용 — API 미인증 세션 우회 시그니처 역탐사</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Check Point 관리 서버 Jumbo Hotfix Accumulator 배포 + OOB 관리망 격리 점검 (CVE-2026-91843)</div><div class=\"act-sub\">루트 권한 RCE — 방화벽 룰셋 변조 여부 감사 대조</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">'이토마토' 사고 교훈 — 금융 플랫폼 DB 접근 제어(DAC) 강화 + 컬럼 암호화·이상 쿼리 롤백 체계 점검</div><div class=\"act-sub\">데이터 변조(Data Tampering) — 2차 금융 사기·피싱 계좌 조작 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">해운·항만 관련 자산 OT/IT 망분리 상태 전수 점검 + 국가 배후 공격 시나리오 대응 훈련</div><div class=\"act-sub\">유조선 2척 침투 정황 — USCG 계획서 의무화 조치 동향 추적</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">백악관 정부 주도 사이버 인큐베이터(제로 트러스트·자동 취약점 교정) 정책 동향 모니터링</div><div class=\"act-sub\">국가 주도형 딥테크 투자 모델 — 글로벌 방어 기술 표준 형성에 영향 전망</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: The Hacker News, SecurityWeek, Industrial Cyber, Cybersecurity Dive, 보안뉴스, PYMNTS. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260917_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-16","slug":"","dow":"수","sub":"2026. 09. 16 (WED)","foot":"Pixel 모뎀 제로클릭 제로데이 KEV 등재 · 브라우저 AI 비서 탈취 'AI Agent Hijacking' · CISA·NSA AD 17대 기법 합동 가이드 · 애플 iOS 27 패치 126건 · 오라클 800여 개 패치 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"Zero-Click","l":"Pixel 모뎀 제로데이"},{"n":"17개","l":"AD 침해 기법 합동 가이드"},{"n":"800+","l":"오라클 9월 패치"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 16 (WED)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">Zero-Click</div><div class=\"l\">Pixel 모뎀 제로데이</div></div>\n    <div><div class=\"n\">17개</div><div class=\"l\">AD 침해 기법 합동 가이드</div></div>\n    <div><div class=\"n\">800+</div><div class=\"l\">오라클 9월 패치</div></div>\n  </div>\n  <div class=\"title-foot\">Pixel 모뎀 제로클릭 제로데이 KEV 등재 · 브라우저 AI 비서 탈취 'AI Agent Hijacking' · CISA·NSA AD 17대 기법 합동 가이드 · 애플 iOS 27 패치 126건 · 오라클 800여 개 패치<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 16일자 24시간 보안 뉴스 다이제스트. 구글 Pixel 셀룰러 모뎀 제로클릭 제로데이(CVE-2026-58704) 긴급 패치·KEV 등재, 단일 확장 프로그램으로 브라우저 내장 AI 비서를 탈취하는 'AI Agent Hijacking' 취약점 클래스 공개, CISA·NSA·파이브 아이즈의 Active Directory 17대 침해 기법 합동 방어 가이드라인, 애플 iOS 27·macOS 보안 업데이트 126건, 오라클 9월 정기 업데이트 800여 개 패치를 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">Pixel 셀룰러 모뎀<br>제로클릭 제로데이 패치</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-58704 · KEV 등재 · 9.19 기한</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>구글, Pixel 셀룰러 베이스밴드 모뎀에서 <strong>사용자 상호작용 없이 무선 통신 패킷만으로 시스템 권한 탈취</strong>하는 제로클릭(Zero-Click) 제로데이(CVE-2026-58704) 공식 확인·패치 배포</li>\n      <li>CISA, KEV에 추가 + 연방 기관에 <strong>9월 19일까지 조치 완료</strong> 지시 — 제한적 표적 악용 징후 감지, 용병 스파이웨어 연계 추정</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — Google Patches Pixel Modem Flaw Amid Signs of Limited Targeted Exploitation / SecurityWeek</div>\n  <div class=\"notes\"><p>Pixel 모뎀 펌웨어 인가 로직 결함으로 기지국 신호·조작된 무선 패킷 수신만으로 권한 상승하는 제로클릭 표적 공격. CISA KEV 등재, 9.19 연방 조치 기한.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">베이스밴드 레이어의<br>완전 무인 침투</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>OS 샌드박스가 아무리 정교해도 <strong>하위 베이스밴드 프로세서가 뚫리면 통화 도청·GPS 위치 추적·기기 원격 제어</strong> 가능 — 통신 칩셋 레이어가 모바일 보안의 최심층 사각지대</li>\n      <li>제로클릭은 링크 클릭 등 사용자 행위 자체가 불필요 — 탐지 자체가 극히 어려워 <strong>펌웨어 패치 적용 시점만이 유일한 방어선</strong></li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>정부·기업 주요 인사의 <strong>9월 Pixel 펌웨어 업데이트 즉각 적용</strong>, MDM으로 패치 수준 전수 검증 + 기지국 모사(Emulation) 공격 감시</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / SecurityWeek / CISA KEV 고지 종합</div>\n  <div class=\"notes\"><p>베이스밴드 침투는 OS 방어와 무관하게 도청·추적·원격 제어를 허용. 제로클릭은 탐지가 사실상 불가해 펌웨어 패치 시점 적용이 유일한 방어선.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">단일 확장 프로그램으로<br>AI 비서 탈취 'Hijacking'</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">Chrome·Edge·Claude 등 5종 기법 공개</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>보안 연구진(Forever Security), <strong>일반 권한 브라우저 확장 프로그램이 내장 AI 에이전트의 권한 경계를 우회해 최고 권한 내부 API 호출</strong>로 기업 기밀·브라우징 컨텍스트 탈취하는 'AI Agent Hijacking' 기법 5종 공개</li>\n      <li>웹 스토어 유통 <strong>단순 테마/번역 확장 프로그램이 내부 메시지 브로커로 AI 비서에 은밀히 프롬프트 주입</strong>, 사내 인트라넷 데이터 외부 유출 경로 입증 — Chrome·Edge·Comet·Opera Neon·Claude 대상</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — One Extension Could Hijack AI Assistants Across Chrome, Comet, Opera Neon, and Claude</div>\n  <div class=\"notes\"><p>단일 확장 프로그램이 브라우저 내장 AI 비서의 권한 경계를 우회해 내부 API를 호출, 기업 기밀과 브라우징 컨텍스트를 탈취하는 신종 취약점 클래스. 테마/번역 확장도 공격 벡터.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">브라우저 AI 통합의<br>보안 설계 허점</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>최신 브라우저가 AI 비서에게 <strong>높은 수준의 DOM 접근·탭 제어 권한</strong>을 부여하면서, 수년간 격리해 온 확장 프로그램-핵심 프로세스 간 신뢰 경계가 AI 인터페이스로 허물어짐</li>\n      <li>AI 어시스턴트가 확장 요청을 렌더링할 때 상호 인가 절차 부재 — <strong>Extension-to-AI 샌드박싱(격리) 표준 미비</strong>가 구조적 취약점</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>내부망 접속 세션에서 <strong>확장 프로그램 최소화 + AI 비서의 민감 컨텍스트 접근 제한</strong>, 벤더의 Extension-to-AI 상호 인가 표준 도입 여부 추적</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / Forever Security 연구 종합</div>\n  <div class=\"notes\"><p>AI 비서가 확장 프로그램의 신뢰 경계를 허물었다. Extension-to-AI 샌드박싱 표준이 마련되기 전까지 내부망 세션의 확장 최소화 + AI 컨텍스트 접근 제한이 실질적 완화책.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">CISA·NSA·파이브 아이즈<br>AD 17대 침해 기법 가이드</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">Kerberoasting · DCSync · 골든 티켓</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>CISA·NSA 및 파이브 아이즈(Five Eyes) 동맹, 랜섬웨어·APT가 엔터프라이즈 도메인 장악 시 악용하는 <strong>Kerberoasting·DCSync·골든 티켓 등 17개 핵심 AD 공격 벡터</strong>를 식별한 합동 방어 프레임워크 발표</li>\n      <li>대규모 랜섬웨어의 <strong>90% 이상이 초기 침투 후 Active Directory 설정 오류·레거시 프로토콜을 악용해 도메인 관리자 권한 획득</strong> — 17개 TTPs 심층 해체 + 실시간 이벤트 로그 탐지 쿼리 공개</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber — CISA, NSA, global cyber agencies issue guidance to detect and mitigate 17 Active Directory compromise techniques</div>\n  <div class=\"notes\"><p>CISA·NSA·파이브 아이즈가 AD 17대 침해 기법(Kerberoasting·DCSync·골든 티켓 등) 합동 방어 가이드와 실시간 탐지 쿼리를 공개. 랜섬웨어의 도메인 장악 경로에 대한 공동 대응.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">애플 iOS 27·macOS<br>보안 업데이트 126건</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">ImageIO 메모리 손상 · 스파이웨어 벡터 차단</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>애플, iOS 27·macOS 최신 업데이트로 <strong>iMessage·웹 렌더링 시 악성 이미지 하나로 기기를 원격 장악하는 ImageIO·CoreGraphics 버퍼 오버플로우</strong> 등 스파이웨어 표적 결함 총 <strong>126건 일괄 수정</strong></li>\n      <li>NSO 그룹 등 용병 스파이웨어(Mercenary Spyware)가 iMessage 경유로 표적 인사 아이폰을 감염시키는 <strong>단골 공격 벡터인 메모리 오염 결함</strong>에 ImageIO 파싱 엔진의 메모리 안전성 강화 패치 적용</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>보안뉴스 — 애플, iOS 27 보안 업데이트... 악성 이미지로 아이폰 노리는 취약점 등 126건 대거 수정</div>\n  <div class=\"notes\"><p>애플이 악성 이미지 하나로 기기를 원격 장악하는 ImageIO·CoreGraphics 메모리 손상 등 126건을 일괄 수정. 용병 스파이웨어의 iMessage 제로클릭 벡터 차단에 초점.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">오라클 9월 정기 업데이트<br>800여 개 패치 배포</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">WebLogic · Database RCE 다수</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>오라클, ERP·클라우드 미들웨어 WebLogic Server·엔터프라이즈 데이터베이스 전반에 <strong>RCE 가능한 고위험 결함 포함 800개 이상 보안 패치</strong> 일괄 발표</li>\n      <li>외부 접점과 연결되는 <strong>WebLogic Server는 제로데이 악용 위험이 높아 우선 패치 대상</strong> 지정 — 원격 인증 우회·SQL 인젝션 결함 대거 수정</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek — Oracle Patches 800+ Vulnerabilities in September 2026 Security Update</div>\n  <div class=\"notes\"><p>오라클이 WebLogic·Database 등 800여 개 패치를 일괄 배포. 외부 노출 WebLogic은 제로데이 악용 위험으로 우선 패치 대상 — 분기 집중 패치 환경의 공백 관리가 관건.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">Identity 인프라의<br>상시 무결성 검증(ITDR)</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>단순 계정 관리를 넘어 <strong>Kerberos 티켓 암호화 상향(AES 강제) + 비인가 인증서 템플릿(AD CS) 감사 + Tiered 관리자 권한 분리</strong>를 의무화하는 전사적 Identity 위협 탐지·대응(ITDR) 체계 구축 필수</li>\n      <li>오라클·애플 대규모 패치와 함께 <strong>엔터프라이즈 미들웨어 패치 주기 단축</strong> 요구 — 시스템 중단 우려로 패치를 미루는 기업이 공격 표적으로 전환</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>AD 17대 TTPs 탐지 쿼리 즉시 적용 + 사전 테스트 자동화·가상 패치(WAF 룰셋)로 <strong>패치 공백 최소화</strong>, WebLogic 등 외부 접점 우선 대응</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>CISA·NSA AD 가이드 / 오라클·애플 보안 고지 종합 분석</div>\n  <div class=\"notes\"><p>AD 17대 기법 대응과 엔터프라이즈 패치 주기 단축이 맞물린다. ITDR 체계 + AES 강제 + AD CS 감사 + 가상 패치로 Identity 무결성과 패치 공백을 동시에 관리.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Pixel 모뎀 9월 펌웨어 업데이트 전사 적용 + MDM 패치 수준 검증 (9.19 기한)</div><div class=\"act-sub\">CVE-2026-58704 제로클릭 KEV 등재 — 베이스밴드 도청·추적·원격 제어 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">iOS 27·macOS 최신 보안 업데이트 강제 배포 (ImageIO 메모리 손상 126건)</div><div class=\"act-sub\">용병 스파이웨어 iMessage 제로클릭 벡터 차단 — 표적 인사 우선</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">오라클 WebLogic 등 외부 접점 RCE 패치 우선 적용 + WAF 가상 패치 병행</div><div class=\"act-sub\">9월 800여 개 패치 — 제로데이 악용 위험 자산부터</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">CISA·NSA AD 17대 TTPs 탐지 쿼리 적용 + AES 강제·AD CS 감사·Tiered 권한 분리 점검</div><div class=\"act-sub\">Kerberoasting·DCSync·골든 티켓 차단 — ITDR 체계 구축</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">내부망 세션의 브라우저 확장 최소화 + AI 비서 컨텍스트 접근 제한 검토</div><div class=\"act-sub\">AI Agent Hijacking — Extension-to-AI 샌드박싱 표준 도입 추적</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: The Hacker News, SecurityWeek, Industrial Cyber, 보안뉴스. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260916_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-15","slug":"","dow":"화","sub":"2026. 09. 15 (TUE)","foot":"Cisco SEG 루트 RCE 제로데이 KEV 등재 · Red Heron Gitea RCE 다국적 침투 · CenterPoint Energy 침해 확인 · USCG 상선 사이버보안 규정 · Fime-Red Alert Labs 인수 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"Root RCE","l":"Cisco SEG 제로데이"},{"n":"CenterPoint","l":"텍사스 전력 유틸리티 침해"},{"n":"USCG","l":"상선 사이버 규제 확정"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 15 (TUE)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">Root RCE</div><div class=\"l\">Cisco SEG 제로데이</div></div>\n    <div><div class=\"n\">CenterPoint</div><div class=\"l\">텍사스 전력 유틸리티 침해</div></div>\n    <div><div class=\"n\">USCG</div><div class=\"l\">상선 사이버 규제 확정</div></div>\n  </div>\n  <div class=\"title-foot\">Cisco SEG 루트 RCE 제로데이 KEV 등재 · Red Heron Gitea RCE 다국적 침투 · CenterPoint Energy 침해 확인 · USCG 상선 사이버보안 규정 · Fime-Red Alert Labs 인수<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 15일자 24시간 보안 뉴스 다이제스트. Cisco Secure Email Gateway 루트 RCE 제로데이(CVE-2026-76461) 실전 악용·KEV 등재, 스파이 조직 Red Heron의 Gitea RCE 다국적 침투 캠페인, 텍사스 대형 전력·가스 유틸리티 CenterPoint Energy 침해 공식 확인, 미 해안경비대(USCG) 상선 사이버보안 규제 확정 임박, Fime의 Red Alert Labs 인수를 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">Cisco SEG 루트 RCE<br>제로데이 실전 악용</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-76461 · KEV 등재 · 9.17 패치 기한</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>Cisco Secure Email Gateway(구 IronPort)에서 <strong>인증되지 않은 원격 공격자가 루트(Root) 권한으로 임의 코드 실행(RCE)</strong> 가능한 제로데이(CVE-2026-76461) 실전 공격 적발 — 긴급 패치 배포</li>\n      <li>CISA, KEV에 즉시 등록 + 연방 기관에 <strong>9월 17일까지 패치 완료</strong> 지시 — 특수 제작 이메일 패킷 전송만으로 게이트웨이 OS 루트 장악 후 지속성 스크립트 배포 확인</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek — Root RCE Zero-Day in Cisco Secure Email Gateway Under Active Exploitation / Help Net Security</div>\n  <div class=\"notes\"><p>Cisco SEG 스팸·피싱 방어 엔진 파싱 로직의 사전 인증 결함으로 이메일 패킷 하나면 루트 RCE. 전사 메일 트래픽 도청·내부 피싱 발송 가능 — CISA 3일 기한(9.17) 패치 명령.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">이메일 통신 관문의<br>루트 권한 붕괴</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>이메일 게이트웨이 장악 시 <strong>전사 인바운드/아웃바운드 메일 트래픽 복호화 감청 + 내부 피싱 메일 무단 발송 + 보안 필터링 무력화</strong> — 통신 관문 전체가 공격자의 발판</li>\n      <li>입출력 검증 미흡으로 발생하는 사전 인증 결함 — 게이트웨이가 방화벽보다 먼저 노출되는 '첫 번째 관문'인 만큼 침해 시 탐지가 극히 어려움</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li><strong>AsyncOS 최신 버전 즉시 업데이트 + 기기 무결성 검증</strong>, 게이트웨이 로그에서 비정상 관리 세션·지속성 스크립트 전수 조사</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek / Help Net Security / Cisco 보안 고지 종합</div>\n  <div class=\"notes\"><p>SEG가 뚫리면 메일 도청·내부 피싱·필터링 무력화가 동시에 가능. AsyncOS 업데이트 + 무결성 검증 + 비정상 세션 조사가 3일 기한 내 최우선 대응.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">스파이 조직 Red Heron<br>Gitea RCE 다국적 침투</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-60004 · 산업·정부 타깃</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>사이버 스파이 조직 Red Heron, 오픈소스 Git 서비스 Gitea의 <strong>RCE 결함(CVE-2026-60004)을 무기화</strong> — 전 세계 제조·엔지니어링·공공 기관의 자체 호스팅 코드 저장소 침투 캠페인 포착</li>\n      <li>인터넷 노출 Gitea 인스턴스를 자동 스캔하는 봇넷 가동 → 웹셸 생성 후 <strong>기업 고유 소스코드·하드웨어 펌웨어 소스·엔지니어링 설계 문서 외부 C2로 탈취</strong>, 모듈형 악성코드 설치</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber — Red Heron exploits Gitea RCE flaw in multinational campaign targeting industrial and government organizations</div>\n  <div class=\"notes\"><p>Red Heron이 Gitea API 인가 우회 결함으로 산업·정부 자체 호스팅 Git 저장소를 침투, 설계도·펌웨어 소스를 C2로 빼돌리는 다국적 캠페인 진행 중.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">CenterPoint Energy<br>사이버 침해 공식 확인</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">텍사스 전력·가스 유틸리티 · SCADA 조사 진행</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>텍사스 수백만 가구에 전력 송배전·천연가스를 공급하는 인프라 대기업 CenterPoint Energy, <strong>사내 운영 시스템 외부 비인가 접근 침해 공식 확인</strong> — 긴급 시스템 격리 + 연방 당국과 포렌식 착수</li>\n      <li>운영 시스템 격리로 즉각적 정전은 모면했으나 <strong>송배전망 SCADA 연계망 침투 여부 조사 지속</strong></li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek — Texas Utility CenterPoint Energy Confirms Breach</div>\n  <div class=\"notes\"><p>텍사스 대형 유틸리티 CenterPoint가 침해 공식 확인. 정전은 모면했으나 SCADA 연계망 침투 여부가 최대 변수 — 에너지 그리드 공격 현실화의 또 다른 사례.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">미 해안경비대(USCG)<br>상선 사이버보안 규제 확정</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">OT 위험 평가 + 연방 승인 계획서 의무화</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>USCG, 미국 영해·항만에서 운항하는 <strong>모든 상업용 선박과 해양 시설에 OT 위험 평가 완료 + 연방 정부 승인 사이버 보안 계획서 제출 강제</strong> 규정을 확정 단계 돌입</li>\n      <li>최근 상선·유조선의 항법(ECDIS)·추진 제어망 취약점 부각에 따른 대응 — 규정 미충족 선박은 <strong>미국 항만 입항 거부</strong> 가능</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>MarineLink — As USCG Cyber Rules Loom, Assessing Security Risks</div>\n  <div class=\"notes\"><p>USCG가 상선·항만 운영사에 OT 위험 평가 + 연방 승인 사이버 보안 계획서 제출을 강제. 미충족 시 입항 거부 — 글로벌 해운 공급망의 규제화 전환점.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">Fime, Red Alert Labs 인수<br>IoT·모빌리티 인증 자동화</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">CRA · ISO/SAE 21434 대응 가속</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>디지털 신원·결제 테스트 전문 기업 Fime, IoT 사이버보안 평가 전문 <strong>Red Alert Labs 전격 인수</strong> — EU CRA + 자동차 사이버보안 표준(ISO/SAE 21434) 대응 자동화 체계 구축</li>\n      <li>유럽 CRA·글로벌 스마트 모빌리티 규제 강화로 <strong>디지털 신분증(Digital ID)·생체 인식 결제·커넥티드 카 펌웨어의 엄격한 보안 평가·상호 운용성 검증 요구 급증</strong></li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>FF News — Fime Acquires Red Alert Labs to Scale Cybersecurity Compliance Automation</div>\n  <div class=\"notes\"><p>Fime이 Red Alert Labs를 인수해 CRA·ISO/SAE 21434 인증 자동화. 디지털 신원·모빌리티 표준의 융합으로 '디지털 신뢰' 인프라 시장이 개화.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">온프레미스 소스코드 자산<br>노출과 Gitea 격리</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>보안 관리가 소홀한 <strong>온프레미스 Git 서버(Gitea)가 산업 스파이의 집중 타깃</strong> — 인터넷 노출 인스턴스를 자동 스캔하는 봇넷이 상시 운영</li>\n      <li>자체 호스팅 개발 도구의 보안 사각지대 — 소스코드·펌웨어·설계문서가 C2로 직결되는 탈취 경로가 반복 확인</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>소스코드 저장소 콘솔을 <strong>VPN/폐쇄망 뒤로 격리</strong>, MFA + 커밋 서명(commit signing) 검증 강제, 노출 인스턴스 전수 식별</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber / Red Heron 침투 분석 종합</div>\n  <div class=\"notes\"><p>자체 호스팅 Git 서버가 산업 스파이의 사각지대. 폐쇄망 격리 + MFA + 커밋 서명 검증이 설계도·펌웨어 탈취를 차단하는 기본선.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">에너지 그리드 침해 공포<br>SCADA 연계망 실사</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>CenterPoint 침해는 유틸리티 인프라 표적 공격이 현실화됐음을 보여줌 — <strong>전력망 내 외부 벤더 원격 연결 차단 + OT 물리적 분리(Air-Gap) + 실시간 이상 전력 모니터링</strong> 점검 요구</li>\n      <li>USCG 상선 규제와 함께 <strong>에너지·해운 등 기간 인프라의 사이버 실사 의무화</strong>가 글로벌 트렌드로 고착 — 컴플라이언스 미달 시 영업·입항 제재</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>에너지·해운 자산 OT 인벤토리 + 벤더 원격 접속 경로 최소 권한화, SCADA 연계망 침투 여부 포렌식 우선</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek / MarineLink / CenterPoint 침해 분석 종합</div>\n  <div class=\"notes\"><p>CenterPoint·USCG 규제로 기간 인프라 사이버 실사가 의무화되는 국면. 벤더 원격 연결 차단 + OT Air-Gap + 이상 전력 모니터링이 그리드 침해를 막는 핵심.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Cisco SEG AsyncOS 최신 버전 업데이트 + 기기 무결성 검증 (9.17 기한)</div><div class=\"act-sub\">CVE-2026-76461 루트 RCE KEV 등재 — 전사 메일 도청·내부 피싱 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">인터넷 노출 Gitea 인스턴스 식별 + 폐쇄망 격리·MFA·커밋 서명 검증 강제</div><div class=\"act-sub\">Red Heron 다국적 침투 — 소스코드·펌웨어·설계도 C2 탈취 방지</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">에너지·유틸리티 자산 SCADA 연계망 침투 여부 포렌식 + 벤더 원격 접속 차단</div><div class=\"act-sub\">CenterPoint 침해 교훈 — OT 물리적 분리(Air-Gap) 검토</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">해운·물류 자산 OT 위험 평가 + USCG 사이버 보안 계획서(Cybersecurity Plan) 수립 착수</div><div class=\"act-sub\">미 항만 입항 거부 리스크 — VSAT 암호화·선내 네트워크 분리 투자 확대</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">CRA·ISO/SAE 21434 인증 자동화 동향 모니터링 + Digital ID·모빌리티 보안 평가 체계 점검</div><div class=\"act-sub\">Fime-Red Alert Labs 인수 — 디지털 신뢰 인프라 시장 개화에 대비</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: SecurityWeek, Help Net Security, Industrial Cyber, MarineLink, FF News. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260915_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-14","slug":"","dow":"월","sub":"2026. 09. 14 (MON)","foot":"ScreenConnect 웜형 악용 패치 · JFrog Artifactory 백도어 유포 · DDRop TEE 공격 · 8월 랜섬웨어 997건 사상 최고 · 패스키 사칭 계정 탈취 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"Worm","l":"ScreenConnect 무단 실행"},{"n":"997건","l":"8월 랜섬웨어 사상 최고"},{"n":"DDRop","l":"TEE 기밀컴퓨팅 무력화"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 14 (MON)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">Worm</div><div class=\"l\">ScreenConnect 무단 실행</div></div>\n    <div><div class=\"n\">997건</div><div class=\"l\">8월 랜섬웨어 사상 최고</div></div>\n    <div><div class=\"n\">DDRop</div><div class=\"l\">TEE 기밀컴퓨팅 무력화</div></div>\n  </div>\n  <div class=\"title-foot\">ScreenConnect 웜형 악용 패치 · JFrog Artifactory 백도어 유포 · DDRop TEE 공격 · 8월 랜섬웨어 997건 사상 최고 · 패스키 사칭 계정 탈취<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 14일자 24시간 보안 뉴스 다이제스트. ConnectWise ScreenConnect 웜(Worm)형 무단 파일 전송·실행 취약점 긴급 패치, JFrog Artifactory 3종 결함으로 CI/CD 백도어 유포, DDR5 부채널 공격 'DDRop'이 Intel TDX·AMD SEV-SNP 기밀 컴퓨팅을 무력화, 8월 글로벌 랜섬웨어 997건으로 사상 최고치 경신, 패스키 도입 사칭 소셜 엔지니어링으로 M365 계정 탈취를 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">ScreenConnect 웜형 악용<br>CVE-2026-84869 긴급 패치</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">Worm-like Propagation · Wild Exploited</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>원격 지원·제어 플랫폼 ScreenConnect에서 <strong>호스트 승인 없이 연결된 클라이언트 인스턴스 전반에 임의 파일을 전송·실행</strong>할 수 있는 초고위험 취약점(CVE-2026-84869)이 야생에서 <strong>웜(Worm) 형태로 전파</strong>되며 실제 악용 — 긴급 보안 업데이트 배포</li>\n      <li>세션 처리 결함으로 활성화된 원격 세션 상태에서 관리자 승인(Host Confirmation) 절차를 거치지 않고 엔드포인트에 임의 실행 파일 밀어 넣기 가능</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek — ConnectWise Patches ScreenConnect Vulnerability Exploited in Worm-like Attacks</div>\n  <div class=\"notes\"><p>ScreenConnect 세션 처리 결함을 스크립트화해 한 번의 거점 확보로 연계된 고객사 PC 전체에 악성코드를 동시 전파하는 웜형 공격이 실전 확인. 최신 26.6.5 패치가 긴급 배포.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">MSP 원격 도구의<br>연쇄 침해 차단</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>원격 관리 플랫폼 에이전트가 <strong>자동화된 감염 통로로 악용</strong>될 경우, MSP를 통해 관리받는 다운스트림 엔터프라이즈 수백 곳이 즉시 장악 — 한 거점 확보 → 고객사 전체 동시 전파</li>\n      <li>ScreenConnect는 재택근무·원격 지원의 핵심 관문이라 침해 시 내부망으로의 횡적 이동(Lateral Movement)이 즉각 가능</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>온프레미스·클라우드 인스턴스 전수 <strong>ScreenConnect 최신 26.6.5 업데이트</strong>, 원격 파일 실행 권한 최소화 + 세션 이상 탐지 강화</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek / ConnectWise 보안 고지 종합</div>\n  <div class=\"notes\"><p>MSP 원격 도구가 웜형 전파 통로가 되면 다운스트림 수백 곳이 연쇄 장악. 에이전트 버전 업데이트와 파일 실행 권한 최소화가 연쇄 침해를 끊는 관건.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">JFrog Artifactory 3종 악용<br>CI/CD 백도어 유포</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-82329 등 · Auth Bypass</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>다수 위협 조직, 소프트웨어 바이너리·아티팩트 저장소 JFrog Artifactory의 <strong>인증 우회(CVE-2026-82329 등) 결함 3종</strong> 악용 — 설정 정보 탈취 후 <strong>만료되지 않는 최고 권한 API 토큰 생성</strong>으로 CI/CD 파이프라인에 영구 백도어 설치</li>\n      <li>내부 레포지토리의 기업 고유 소프트웨어 패키지·빌드 산출물을 <strong>악성 코드 포함 바이너리로 치환</strong>, 페더레이션 구성 조작으로 지속성 확보</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek — Three JFrog Artifactory Flaws Exploited for Backdoor Deployment</div>\n  <div class=\"notes\"><p>Artifactory 인증 우회로 만료 없는 최고 권한 토큰을 발급받아 빌드 산출물을 악성 바이너리로 치환. 저장소 오염 시 배포받는 모든 고객사에 정상 서명으로 악성코드가 전달되는 공급망 참사 경로.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">신종 하드웨어 공격 'DDRop'<br>TEE 기밀컴퓨팅 무력화</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">Intel TDX · AMD SEV-SNP 타격</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>DDR5 메모리 버스 중재(Arbitration) 과정의 <strong>패킷 드롭 부채널 결함</strong>을 악용, 퍼블릭 클라우드 TEE인 <strong>Intel TDX·AMD SEV-SNP 암호화 메모리 영역에서 기밀 데이터와 암호화 키 추출</strong>하는 'DDRop' 공격 발표</li>\n      <li>클라우드 호스트 OS·하이퍼바이저 권한의 공격자가 <strong>투기적 실행(Speculative Execution) 중 미세 신호 측정</strong>으로 Enclave 내부의 암호화 마스터 키·평문 메모리 복원</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — New DDRop Attack Breaks Intel TDX and AMD SEV-SNP Confidential Computing</div>\n  <div class=\"notes\"><p>DDRop은 DDR5 버스 아비트레이션 패킷 드롭 부채널로 하이퍼바이저 권한에서 TDX·SEV-SNP Enclave의 마스터 키와 평문을 복원. '하이퍼바이저도 신뢰하지 않는다'는 기밀 컴퓨팅의 하드웨어 기반이 흔들린 사례.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">8월 글로벌 랜섬웨어<br>997건, 사상 최고치</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">전년 대비 2배 폭증 · 유틸리티·헬스케어 집중</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>8월 한 달간 전 세계 공개 랜섬웨어 공격 <strong>997~1,042건으로 역대 월간 최다 기록 경신</strong> — 전년 동기 대비 약 2배 폭증</li>\n      <li><strong>에너지 유틸리티·의료 부문 피해 급증</strong>, 기관당 주간 사이버 공격 빈도 2,422건으로 22% 증가 — 오픈소스 AI로 제로데이 무기화·정찰 속도 비약적 단축</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Industrial Cyber — Global ransomware attacks hit record 997 in August 2026 / Check Point Research — 14th September Threat Intelligence Report</div>\n  <div class=\"notes\"><p>8월 랜섬웨어 997건으로 사상 최고. 오픈소스 AI가 제로데이 무기화와 정찰을 가속하며 방어 취약한 에너지·수자원 유틸리티와 병원망이 주 타깃.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">'패스키 도입' 사칭<br>M365 계정 탈취 확산</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">FIDO2 역이용 · 권한 고착화</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>사내 IT 지원팀 사칭, '<strong>보안 강화를 위한 필수 패스키 등록</strong>'을 안내하는 전화·문자 피싱으로 직원 계정 침투 — 공격자가 <strong>자체 FIDO2 보안 키를 피해자 계정에 강제 등록</strong>해 세션 영구 장악 후 SharePoint 데이터 탈취</li>\n      <li>비밀번호 없는 패스키 전환 흐름을 역이용 — 1차 세션 가로채기 후 새 인증 수단 등록으로 <strong>비밀번호 변경해도 계정 제어권 유지</strong></li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>CISOSeries — Passkey phishing attack / Check Point Research — 14th September Threat Intelligence Report</div>\n  <div class=\"notes\"><p>패스키 도입 사칭 피싱으로 M365 계정에 공격자 FIDO2 키를 강제 등록, 비밀번호 변경해도 제어권을 유지하는 권한 고착화 수법이 확산.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">공급망 빌드 파이프라인<br>백도어화와 무결성 검증</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>소프트웨어 저장소 오염 시 이를 배포받는 <strong>모든 고객사에 악성코드가 정상 서명되어 전달</strong>되는 치명적 공급망 참사로 번짐 — Artifactory가 빌드 무결성의 단일 실패점(SPOF)</li>\n      <li>만료 없는 최고 권한 토큰 + 페더레이션 조작으로 <strong>지속성(Persistence) 확보</strong> — 단순 패치만으로는 제거 불가</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>Artifactory 긴급 패치 + <strong>기존 생성된 모든 관리자 토큰 전면 취소</strong>, 패키지 해시(Hash) 무결성 재검증</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>SecurityWeek / JFrog 보안 고지 종합</div>\n  <div class=\"notes\"><p>빌드 저장소가 오염되면 배포받는 전 고객사에 정상 서명 악성코드가 전달. 토큰 전면 취소 + 패키지 해시 무결성 재검증이 백도어 제거의 전제.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">DDRop 이후<br>기밀컴퓨팅 아키텍처 재검토</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>하이퍼바이저조차 신뢰하지 않는다는 <strong>제로 트러스트 기밀 컴퓨팅의 하드웨어 기반이 흔들린</strong> 사례 — DDR5 부채널로 TEE 격리가 우회됨</li>\n      <li>8월 랜섬웨어 997건 + Breakout Time 분 단위 단축으로 <strong>수작업 보안관제는 불가</strong> — 기계 속도 공격에 SOAR 기반 자율 격리 필수</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>CPU·메모리 컨트롤러 <strong>마이크로코드 패치 적용</strong>, 금융·국방 워크로드 멀티테넌시 분리 검토 + 이상 징후 시 자산 논리 분리(SOAR 자율 격리) 도입</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News / Check Point Research 종합 분석</div>\n  <div class=\"notes\"><p>DDRop은 기밀 컴퓨팅의 하드웨어 신뢰 기반을 흔들고, 랜섬웨어 폭증은 수작업 관제의 한계를 증명. 마이크로코드 패치 + 멀티테넌시 분리 + SOAR 자율 격리가 다음 방어선.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">ScreenConnect 전수 최신 26.6.5 업데이트 + 원격 파일 실행 권한 최소화</div><div class=\"act-sub\">CVE-2026-84869 웜형 전파 — MSP 다운스트림 연쇄 침해 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">JFrog Artifactory 패치 + 기존 관리자 토큰 전면 취소 + 패키지 해시 무결성 재검증</div><div class=\"act-sub\">인증 우회 3종 — CI/CD 백도어·빌드 산출물 치환 악용 중</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">'패스키 등록' 사칭 피싱 주의보 발령 + FIDO2 신규 키 등록 시 Step-Up 재인증 통제</div><div class=\"act-sub\">M365 계정 탈취·권한 고착화 — 대면 승인·OOB 교차 확인 정책 강화</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">유틸리티·헬스케어 등 OT/ICS 자산 인벤토리 + SOAR 기반 자율 격리 체계 점검</div><div class=\"act-sub\">8월 랜섬웨어 997건 — Breakout Time 분 단위, 수작업 관제 한계</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">TEE(기밀 컴퓨팅) 워크로드 멀티테넌시 분리 + CPU/메모리 마이크로코드 패치 동향 모니터링</div><div class=\"act-sub\">DDRop — TDX·SEV-SNP 부채널 우회, 하드웨어 신뢰 기반 재검토</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: SecurityWeek, The Hacker News, Industrial Cyber, Check Point Research, CISOSeries. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260914_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-13","slug":"","dow":"일","sub":"2026. 09. 13 (SUN)","foot":"GitLab CVSS 10 KEV 긴급 등재 · NSA 5대 미션 센터 개편 · Check Point VPN 초고위험 경보 · 해양 OT 보안 사각지대 · Conti 핵심 개발자 실형 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"CVSS 10.0","l":"GitLab KEV 등재"},{"n":"5대","l":"NSA 미션 센터 신설"},{"n":"CVSS 9.8","l":"Check Point VPN 취약점"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 13 (SUN)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">CVSS 10.0</div><div class=\"l\">GitLab KEV 등재</div></div>\n    <div><div class=\"n\">5대</div><div class=\"l\">NSA 미션 센터 신설</div></div>\n    <div><div class=\"n\">CVSS 9.8</div><div class=\"l\">Check Point VPN 취약점</div></div>\n  </div>\n  <div class=\"title-foot\">GitLab CVSS 10 KEV 긴급 등재 · NSA 5대 미션 센터 개편 · Check Point VPN 초고위험 경보 · 해양 OT 보안 사각지대 · Conti 핵심 개발자 실형<br>국내외 주요 정보보안 이슈 요약 및 심층 분석</div>\n  <div class=\"notes\"><p>2026년 9월 13일자 24시간 보안 뉴스 다이제스트. CISA의 GitLab CVSS 10.0 KEV 긴급 등재와 9월 14일 패치 명령, 미 NSA의 AI·사이버 통합 '5대 미션 센터' 조직 개편, 네덜란드 NCSC의 Check Point VPN 초고위험 취약점 실전 악용 임박 경고, 상선 추진·조타·ECDIS를 노린 해양 OT 보안 사각지대, 콘티(Conti) 랜섬웨어 핵심 개발자의 징역 4년 실형을 다룹니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 1</div>\n  <h2 class=\"s-title\">GitLab CVSS 10.0<br>KEV 긴급 등재·9.14 패치</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">On-Prem · 임의 파일 읽기 · 실전 악용</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>CISA, 온프레미스 GitLab 서버의 <strong>임의 파일 읽기 취약점(CVSS 10.0)</strong>을 KEV에 긴급 등록 — 연방 기관에 <strong>9월 14일까지 패치 완료</strong> 명령</li>\n      <li>비공개 저장소 소스코드·클라우드 API 키·CI/CD 환경 변수 탈취를 노린 <strong>실전 공격이 진행 중</strong> — 특수 조작 쿼리로 서버 루트 파일 시스템의 민감 파일 직접 읽기 가능</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>보안뉴스 — CISA, 해커가 악용 중인 깃랩(GitLab) 치명적 취약점 경고 / The Hacker News</div>\n  <div class=\"notes\"><p>GitLab 온프레미스 임의 파일 읽기 결함이 KEV에 등재, 9.14 패치 명령. DB 연결 문자열·AWS/GCP 마스터 토큰을 덤프하려는 실전 공격이 진행 중.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 1</div>\n  <h2 class=\"s-title\">개발·배포 파이프라인<br>기밀 노출 비상</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>소스코드 탈취에 그치지 않고 <strong>클라우드 인프라 접근 키(AWS/GCP 마스터 토큰) 유출 시 전사 서비스 장악</strong> — 2차 소프트웨어 공급망 오염으로 직결</li>\n      <li>CI/CD 파이프라인 환경 변수·DB 연결 문자열이 덤프 대상 — 개발 인프라가 공격자의 내부 거점으로 전환되는 경로</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>온프레미스 GitLab <strong>즉각 버전 업그레이드 + 외부 인터넷 직접 노출 차단</strong>, 기존 발급 API 토큰 전면 무효화·재발급</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>CISA KEV 고지 / The Hacker News 분석 종합</div>\n  <div class=\"notes\"><p>GitLab 침해는 소스코드 탈취를 넘어 클라우드 마스터 토큰 유출로 전사 장악으로 이어지는 2차 공급망 오염 경로. 패치 + 인터넷 노출 차단 + 토큰 전면 무효화가 시급.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 2</div>\n  <h2 class=\"s-title\">미 NSA, AI·사이버 통합<br>'5대 미션 센터' 신설</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">Machine Speed 국가 안보 대응</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>NSA, AI와 사이버 위협이 결합된 <strong>기계 속도(Machine Speed)의 국가 안보 위협</strong>에 대응해 신호정보(SIGINT)·사이버 방어·AI 오펜시브 역량을 하나로 통합하는 <strong>'5대 미션 센터' 체제로 전면 재편</strong></li>\n      <li>적대국이 오픈소스 LLM으로 침투 속도를 비약적으로 높이고 국가 기간망을 위협하는 데 따른 구조 대응 — 부서 간 칸막이 허물고 단일 지휘체계로 통합</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Record — Thorough reorganization at NSA will create five 'mission centers,' including cyber and AI</div>\n  <div class=\"notes\"><p>NSA가 SIGINT·사이버 방어·AI 오펜시브를 단일 지휘체계로 묶는 5대 미션 센터 발족. 국가 사이버전의 대응 템포가 기계 속도로 가속되는 분기점.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 3</div>\n  <h2 class=\"s-title\">Check Point VPN 초고위험<br>실전 악용 임박 경고</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-crit\">CVE-2026-85102·85103 · CVSS 9.8</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>네덜란드 NCSC, 엔터프라이즈 게이트웨이 Check Point VPN의 <strong>취약점 2종(CVE-2026-85102, CVE-2026-85103)을 노린 무차별 공격 임박</strong> 경고 — 인증 우회로 내부망 장악</li>\n      <li>원격 근무·본-지사 연결에 널리 쓰이는 방화벽/VPN 게이트웨이의 <strong>인증 핸들러 메모리 손상 결함(CVSS 9.8)</strong> — 공격 그룹이 자동화 익스플로잇 완성 후 타깃 스캔 개시</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>벤더 긴급 핫픽스 즉시 적용 + 게이트웨이 <strong>이상 로그인 로그·비인가 세션 전수 조사</strong> — 침투 시 내부망 최고 권한 횡적 이동 직결</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Security Boulevard — Daily OT Security News: September 13, 2026</div>\n  <div class=\"notes\"><p>Check Point VPN 인증 핸들러 메모리 손상(CVSS 9.8) 2종에 자동화 익스플로잇 완성 후 스캔 개시. 원격 관문 패치의 골든타임이 짧아 핫픽스 + 세션 전수 조사가 필수.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 4</div>\n  <h2 class=\"s-title\">해양 OT 보안 사각지대<br>상선 추진·조타 통제 위협</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">Maritime OT · VSAT 연결 · IDS 전무</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>글로벌 상선·유조선의 <strong>추진·조타·밸러스트수 제어 시스템이 위성 통신망(VSAT)과 연결</strong>된 반면 침입 탐지 도구가 전무 — 선박을 원격 나포하거나 물리적으로 멈춰 세울 수 있는 사각지대</li>\n      <li>항법 제어(ECDIS)·엔진 제어·밸러스트수 조정 장치가 육상 관제센터와 상시 연결, 그러나 선내 장비는 <strong>수십 년 된 레거시 PLC + 비표준 프로토콜</strong>로 EDR 설치 불가</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Security Boulevard — Daily OT Security News: September 13, 2026 (Maritime OT)</div>\n  <div class=\"notes\"><p>스마트 선박화로 항법·엔진·밸러스트 제어 VSAT 상시 연결인데 침입 탐지 전무. 조타·밸러스트 원격 조작 시 해협 봉쇄·환경 재앙으로 이어질 수 있는 해양 OT 사각지대.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Top Story 5</div>\n  <h2 class=\"s-title\">콘티(Conti) 랜섬웨어<br>핵심 개발자 징역 4년</h2>\n  <hr class=\"rule-double\">\n  <div class=\"badge b-warn\">RaaS 핵심 기술진 실형 선고</div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">개요</div>\n    <ul>\n      <li>글로벌 의료기관·핵심 인프라를 상대로 파괴적 이중 협박을 가했던 러시아계 <strong>콘티(Conti) 랜섬웨어 조직의 맞춤형 악성코드 제작·공격 가담자, 미국 연방법원에서 징역 4년 실형</strong></li>\n      <li>미 법무부 국제 공조 수사 끝에 해외 도피 중 체포·미국 인도 성사 — 병원·정부 인프라 마비와 수억 달러 갈취에 관여한 핵심 기술진 추적</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Security Boulevard — Daily OT Security News: September 13, 2026 (Conti Sentencing)</div>\n  <div class=\"notes\"><p>콘티 랜섬웨어 핵심 개발자가 징역 4년 실형. RaaS 운영자의 브레인(악성코드 개발자)도 사법망을 피할 수 없다는 국제 사법 공조의 실질적 성과.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 2</div>\n  <h2 class=\"s-title\">국가 첩보·사이버 방어의<br>AI 중심 일원화</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>SIGINT와 사이버 작전의 융합 — AI 모델로 <strong>자동화된 외교·군사 위협 탐지 + 공격자 인프라 실시간 무력화(Takedown)</strong>를 핵심 임무로 통합</li>\n      <li>글로벌 사이버전 대응 템포가 <strong>'기계 속도(Machine Speed)'로 가속</strong>되는 분기점 — 적대국의 오픈소스 LLM 침투에 맞선 방어 일원화</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">의미</div>\n    <ul>\n      <li>단순 수직 칸막이 부서 구조에서 단일 지휘체계로 — 탐지·판단·대응을 하나의 파이프라인으로 압축해 대응 지연 최소화</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Record / NSA 조직 개편 분석 종합</div>\n  <div class=\"notes\"><p>NSA 5대 미션 센터는 SIGINT·사이버·AI를 단일 지휘로 묶어 기계 속도 대응을 제도화. 탐지-판단-대응 지연을 줄이는 일원화가 국가 사이버전의 새 기준.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Deep Dive 3</div>\n  <h2 class=\"s-title\">해상 물류 마비의 뇌관<br>선내 세그멘테이션 시급</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적·장기적 파급</div>\n    <ul>\n      <li>해커가 선박 조타·밸러스트 제어망을 원격 조작할 경우 <strong>주요 해협 봉쇄·환경 재앙으로 직결</strong> — 글로벌 물류 마비의 숨은 뇌관</li>\n      <li>레거시 PLC + 비표준 프로토콜에 EDR 설치 불가라는 구조적 한계 — 기존 엔드포인트 보안 모델이 해양 OT에는 적용되지 않음</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">권고</div>\n    <ul>\n      <li>국제해사기구(IMO) 표준에 따른 <strong>선내 네트워크 세그멘테이션 + 위성 통신 단방향 게이트웨이</strong> 구축 시급</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Security Boulevard / 해양 OT 보안 분석 종합</div>\n  <div class=\"notes\"><p>해양 OT는 EDR 불가 구조라 기존 엔드포인트 모델이 무용. IMO 표준 기반 선내 세그멘테이션과 VSAT 단방향 게이트웨이가 해상 물류 마비 방어의 핵심.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action Items</div>\n  <h2 class=\"s-title\">오늘의 조치 사항</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">GitLab 온프레미스 패치(9.14 기한) + 인터넷 직접 노출 차단 + API 토큰 전면 무효화</div><div class=\"act-sub\">CVSS 10.0 KEV 등재 — 소스코드·클라우드 마스터 토큰 실전 탈취 진행 중</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-now\">즉시</div><div><div class=\"act-head\">Check Point VPN 긴급 핫픽스 적용 + 이상 로그인·비인가 세션 전수 조사</div><div class=\"act-sub\">CVE-2026-85102·85103 CVSS 9.8 — 자동화 익스플로잇 완성 후 스캔 개시</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">해상·물류 자산(선박) VSAT 연결 인벤토리 + 선내 세그멘테이션 검토</div><div class=\"act-sub\">해양 OT 사각지대 — 조타·밸러스트 원격 조작 위협 대비</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-soon\">금주</div><div><div class=\"act-head\">CI/CD 파이프라인 시크릿(AWS/GCP 토큰) 노출 점검 및 접근 키 순환</div><div class=\"act-sub\">GitLab 침해의 2차 공급망 오염 경로 차단</div></div></div>\n  <div class=\"act-row\"><div class=\"act-tag t-mon\">지속</div><div><div class=\"act-head\">기계 속도(Machine Speed) 대응·AI 자율 헌팅 인프라 확대 + RaaS 개발자 추적 동향 모니터링</div><div class=\"act-sub\">NSA 개편 기조 반영 — 국제 사법 공조 성과에 따른 억지력 강화</div></div></div>\n  <div class=\"src\"><b>편집 고지</b>본 PPT는 각 보도 기관의 원문 기반 정리입니다. 상세 내용은 출처 링크를 확인하시기 바랍니다.</div>\n  <div class=\"notes\"><p>출처: 보안뉴스, The Hacker News, The Record, Security Boulevard. 각 보도 기관의 원문을 기반으로 한 24시간 보안 뉴스 다이제스트.</p></div>\n</section>"],"_file":"security-digest-20260913_portrait.html","css":"4d8c0ddf"},{"date":"2026-09-12","slug":"","dow":"토","sub":"2026. 09. 12 (SAT)","foot":"BlueMoon 상용 익스플로잇 킷 · CISA KEV 5종 등재 · 현대차 협력사 해킹 · 보스턴사이언티픽 전면 복구 · 러시아 해커의 Claude 악용 국내외 주요 정보보안 이슈 요약 및 심층 분석","meta":[{"n":"4개","l":"스파이 그룹 BlueMoon"},{"n":"5종","l":"CISA KEV 긴급 등재"},{"n":"100%","l":"보스턴사이언티픽 복구"}],"slides":["<section class=\"slide title-slide\">\n  <div class=\"s-tag\">Security Daily Digest</div>\n  <h1 class=\"s-title\">24시간<br>보안 뉴스<br>다이제스트</h1>\n  <div class=\"title-date\">2026. 09. 12 (SAT)</div>\n  <div class=\"title-meta\">\n    <div><div class=\"n\">4개</div><div class=\"l\">스파이 그룹 BlueMoon</div></div>\n    <div><div class=\"n\">5종</div><div class=\"l\">CISA KEV 긴급 등재</div></div>\n    <div><div class=\"n\">100%</div><div class=\"l\">보스턴사이언티픽 복구</div></div>\n  </div>\n  <div class=\"title-foot\">BlueMoon 상용 익스플로잇 킷 · CISA KEV 5종 등재 · 현대차 협력사 해
