<div class=\"s-tag\">01 · 심층 분석</div>\n  <h2 class=\"s-title\">SAP Commerce Cloud<br>CVSS 10.0</h2>\n  <span class=\"badge b-crit\">극심 · 야생 악용 진행 중</span>\n  <div class=\"blk\">\n    <div class=\"blk-label\">사건 배경</div>\n    <ul>\n      <li>백엔드 Telnet 인터페이스의 <strong>미인증 원격 코드 실행(RCE)</strong> 취약점, <em>CVE-2026-58231</em></li>\n      <li>보안 패치 배포 <strong>수일 만에</strong> 자동화 익스플로잇 스캔·침투 시도 급증</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적 · 장기적 파급</div>\n    <ul>\n      <li><strong>결제망·공급망 직접 타격</strong> — 결제 정보 탈취, 주문 조작, 랜섬웨어 유포로 직결</li>\n      <li>인터넷 직접 노출 엔드포인트의 <strong>네트워크 격리</strong>와 패치 <strong>즉시 적용</strong> 필수</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>The Hacker News — \"SAP Commerce Cloud CVE-2026-58231 Targeted in Exploitation Attempts Days After Patch\"</div>\n  <div class=\"notes\"><p>가장 시급한 건입니다. 커머스 백엔드가 장악되면 결제 정보 탈취와 랜섬웨어로 직결되므로, 인터넷 노출 엔드포인트 격리와 패치 즉시 적용이 최우선입니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">02 · 심층 분석</div>\n  <h2 class=\"s-title\">대만 정부망<br>AI 에이전트 공격</h2>\n  <span class=\"badge b-high\">중대 · 국가급 사이버전</span>\n  <div class=\"blk\">\n    <div class=\"blk-label\">사건 배경</div>\n    <ul>\n      <li>디지털발전부(MODA)·국가사이버안전청(ACS) <strong>공식 확인</strong></li>\n      <li>AI 에이전트가 <strong>스스로</strong> 취약점 정찰 → 계정 탈취 수행, 다수 에이전트가 기계 속도로 <strong>병렬</strong> 침투</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적 · 장기적 파급</div>\n    <ul>\n      <li><strong>Agentic AI 위협의 실전 검증</strong> — 지정학적 갈등 지역 정부망에서 자율 침투 확인</li>\n      <li>방화벽·SIEM을 넘어 <strong>AI 기반 적응형 방어(Adaptive Defense)</strong>가 국가 안보 과제로 부상</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Futurum Research · Taipei Times — \"Taiwan targeted in AI-driven hacking campaign\"</div>\n  <div class=\"notes\"><p>구조적으로 가장 중요한 건입니다. 실험실이 아니라 실제 지정학적 갈등 지역에서 준자율 AI 침투가 검증된 셈입니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">03 · 심층 분석</div>\n  <h2 class=\"s-title\">서강대 학사 시스템<br>18만 건 유출</h2>\n  <span class=\"badge b-high\">중대 · 교육기관 침해</span>\n  <div class=\"blk\">\n    <div class=\"blk-label\">사건 배경</div>\n    <ul>\n      <li>학사 행정 시스템 <strong>해킹 침해</strong>, 재학생·졸업생·교직원의 <strong>학번·성명·아이디 18만여 건</strong> 노출</li>\n      <li>유출 통지·시스템 점검 단행, <strong>관계 당국 합동 조사</strong> 착수</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적 · 장기적 파급</div>\n    <ul>\n      <li>민감 정보 다량 보유에도 <strong>보안 투자 취약한 교육기관</strong>의 구조적 취약성 재확인</li>\n      <li>유출 계정 기반 <strong>2차 크리덴셜 스터핑·스피어 피싱</strong> 위협, <strong>MFA 전면 도입</strong> 시급</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>보안뉴스 — \"취약점 경고 및 보안 업데이트: 서강대 개인정보 18만건 유출\"</div>\n  <div class=\"notes\"><p>국내 건입니다. 유출된 계정이 2차 피싱·크리덴셜 스터핑에 악용될 수 있어 MFA 전면 도입이 시급합니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">04 · 심층 분석</div>\n  <h2 class=\"s-title\">macOS 화면 공유<br>모네로 채굴기 유포</h2>\n  <span class=\"badge b-mid\">주의 · 크립토재킹</span>\n  <div class=\"blk\">\n    <div class=\"blk-label\">사건 배경</div>\n    <ul>\n      <li>화면 공유 프로토콜의 <strong>인증 미흡 결함</strong> 악용, 원격 쉘 획득 후 <strong>XMRig 마이너</strong> 백그라운드 상주</li>\n      <li>피해자 시스템 리소스 <strong>무단 탈취</strong> 캠페인 식별</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적 · 장기적 파급</div>\n    <ul>\n      <li>기업 내 Mac 도입률 상승에 맞춰 <strong>Mac 표적 악성코드 다양화</strong></li>\n      <li>윈도우 외 macOS <strong>인프라 침해·자원 착취</strong> 고도화, <strong>macOS 전용 EDR</strong> 모니터링 요구</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Security Affairs — \"macOS Screen Sharing Flaw Exploited to Deploy Monero Miners\"</div>\n  <div class=\"notes\"><p>엔드포인트 표적이 윈도우에서 Mac으로 확대되고 있습니다. 크립토재킹 시그니처 모니터링과 macOS EDR 커버리지가 필요합니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">05 · 심층 분석</div>\n  <h2 class=\"s-title\">미 백악관<br>민간 Hack-Back 규정</h2>\n  <span class=\"badge b-watch\">동향 · 거버넌스</span>\n  <div class=\"blk\">\n    <div class=\"blk-label\">사건 배경</div>\n    <ul>\n      <li>민간 보안기업의 <strong>해외 범죄 조직 대상 역공격 허용</strong> 세부 조건 공개</li>\n      <li>참여 기업 <strong>100만 달러(약 13.8억 원) 에스크로 예치</strong> + <strong>DOJ·DHS 건별 서면 승인</strong> 필수화</li>\n    </ul>\n  </div>\n  <div class=\"blk\">\n    <div class=\"blk-label\">기술적 · 장기적 파급</div>\n    <ul>\n      <li><strong>사이버 교전의 민간화</strong> — 공탁금·사전 승인으로 오폭 방지하는 책임성 장치</li>\n      <li>배후 국가와의 <strong>외교 마찰</strong> 및 공격 조직 <strong>보복(Retaliation)</strong> 리스크 관리가 관건</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>출처</b>Tom's Hardware — \"White House authorizes private companies to launch 'hack-back' cyberattacks\"</div>\n  <div class=\"notes\"><p>합법화된 민간 사이버 역공의 통제 장치입니다. 무분별한 보복전과 제3국 인프라 피해를 차단하는 안전판인 동시에 외교 리스크를 키우는 요인입니다.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Signal</div>\n  <h2 class=\"s-title\" style=\"font-size:28px\">5건에서 읽는<br>4가지 시그널</h2>\n  <hr class=\"rule-double\">\n  <div class=\"trend-card\">\n    <div class=\"trend-kicker\">패치 → 야생 악용, 시간축소</div>\n    <div class=\"trend-body\">SAP 사례처럼 패치 직후 자동화 공격이 시작. <strong>패치 SLA를 '수일'에서 '수시간'으로</strong> 단축해야 하는 시대.</div>\n  </div>\n  <div class=\"trend-card\">\n    <div class=\"trend-kicker\">Agentic AI 실전 투입</div>\n    <div class=\"trend-body\">자율형 AI가 국가급 사이버전 도구로 검증. <strong>공격과 방어 모두 AI화</strong> — 적응형 방어가 필수.</div>\n  </div>\n  <div class=\"trend-card\">\n    <div class=\"trend-kicker\">엔드포인트 표적 다양화</div>\n    <div class=\"trend-body\">macOS 채굴기 유포로 <strong>Mac 표적 인프라 침해</strong> 고도화. EDR 커버리지의 크로스 플랫폼 확장 필요.</div>\n  </div>\n  <div class=\"trend-card\">\n    <div class=\"trend-kicker\">거버넌스·정책 공백</div>\n    <div class=\"trend-body\">민간 hack-back 합법화는 <strong>사이버 교전의 민간화</strong>. 책임성 장치와 외교·보복 리스크 관리가 새 안보 의제.</div>\n  </div>\n  <div class=\"notes\"><p>4가지 시그널: 패치-악용 시간축소, AI 실전, 엔드포인트 다양화, 거버넌스 공백.</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Action</div>\n  <h2 class=\"s-title\" style=\"font-size:28px\">우선순위별 대응</h2>\n  <hr class=\"rule-double\">\n  <div class=\"act-row\">\n    <div class=\"act-tag t-now\">즉시</div>\n    <div><div class=\"act-head\">SAP Commerce Cloud 패치 + 노출 엔드포인트 격리</div><div class=\"act-sub\">CVSS 10.0 야생 악용 대응 — 미인증 RCE 경로 차단, 세그멘테이션</div></div>\n  </div>\n  <div class=\"act-row\">\n    <div class=\"act-tag t-now\">즉시</div>\n    <div><div class=\"act-head\">MFA 전면 확대</div><div class=\"act-sub\">서강대 유출 등 크리덴셜 스터핑·스피어 피싱 대비 2차 인증 강제</div></div>\n  </div>\n  <div class=\"act-row\">\n    <div class=\"act-tag t-soon\">단기</div>\n    <div><div class=\"act-head\">Agentic AI 탐지 — 적응형 방어 PoC</div><div class=\"act-sub\">자율 AI 정찰·권한 상승 패턴 탐지, 기존 SIEM 보완</div></div>\n  </div>\n  <div class=\"act-row\">\n    <div class=\"act-tag t-soon\">단기</div>\n    <div><div class=\"act-head\">macOS EDR 도입/확장</div><div class=\"act-sub\">화면 공유 프로토콜 패치 확인, 크립토재킹 시그니처 모니터링</div></div>\n  </div>\n  <div class=\"act-row\">\n    <div class=\"act-tag t-mon\">모니터</div>\n    <div><div class=\"act-head\">미 Hack-Back 정책 후속</div><div class=\"act-sub\">참여 기업 명단·건별 승인 사례 추적, 외교 리스크 모니터링</div></div>\n  </div>\n  <div class=\"notes\"><p>즉시 2건(패치+격리, MFA), 단기 2건(AI 탐지 PoC, macOS EDR), 모니터링 1건(hack-back 후속).</p></div>\n</section>","<section class=\"slide\">\n  <div class=\"s-tag\">Sources</div>\n  <h2 class=\"s-title\" style=\"font-size:28px\">출처</h2>\n  <hr class=\"rule-double\">\n  <div class=\"blk\" style=\"margin-top:8px\">\n    <ul>\n      <li><strong>The Hacker News</strong> — SAP Commerce Cloud CVE-2026-58231</li>\n      <li><strong>Futurum Research</strong> — Agentic AI and Cybersecurity Readiness</li>\n      <li><strong>Taipei Times</strong> — Taiwan targeted in AI-driven hacking campaign</li>\n      <li><strong>보안뉴스</strong> — 서강대 개인정보 18만건 유출</li>\n      <li><strong>Security Affairs</strong> — macOS Screen Sharing / Monero Miners</li>\n      <li><strong>Tom's Hardware</strong> — White House private hack-back policy</li>\n    </ul>\n  </div>\n  <div class=\"src\"><b>편집 고지</b>위험도 배지(극심/중대/주의/동향)는 보도 내용 기반 편집 판단이며, 개별 사건의 최종 위험도는 공식 CVSS·당국 발표를 기준으로 재확인해야 합니다. 수집 기준: 2026-08-15 (금) 24시간.</div>\n  <div class=\"notes\"><p>6개 원천 매체. 위험도 배지는 편집 판단임을 고지합니다.</p></div>\n</section>"],"_file":"security-digest-20260815_portrait.html","css":"d90bacbc"}];

y{font-size:14px;line-height:1.55;color:var(--text-2)}\n.trend-body strong{color:var(--text-1)}\n/* ═══ 슬라이드 9: 액션 ═══ */\n.act-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--color-rule)}\n.act-row:last-of-type{border-bottom:none}\n.act-tag{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.06em;min-width:52px;padding-top:2px}\n.act-tag.t-now{color:var(--bad)}.act-tag.t-soon{color:var(--warn)}.act-tag.t-mon{color:var(--text-3)}\n.act-head{font-size:15.5px;font-weight:700;line-height:1.4}\n.act-sub{font-size:13px;line-height:1.5;color:var(--text-2);margin-top:4px}\n/* ═══ 타이틀 슬라이드 ═══ */\n.title-slide{justify-content:center}\n.title-slide .s-title{font-size:52px;line-height:1.1}\n.title-date{font-family:var(--font-mono);font-size:15px;letter-spacing:.14em;color:var(--text-2);margin-top:22px}\n.title-meta{display:flex;gap:26px;margin-top:34px}\n.title-meta div{border-top:2px solid var(--text-1);padding-top:10px}\n.title-meta .n{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}\n.title-meta .l{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:6px}\n.title-foot{margin-top:auto;font-size:12px;color:var(--text-3);line-height:1.6}\n/* ═══ 크롬 ═══ */\n.pbar{position:absolute;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:30;transition:width .3s ease}\n.counter{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--text-3);z-index:30;pointer-events:none}\n.hint{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:13px;color:var(--text-3);z-index:29;opacity:.9;transition:opacity .6s ease;pointer-events:none}\n.hint.gone{opacity:0}\n.notes{display:none}"};
var MONTH_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var SLUG_KO = {pm:'저녁판', am:'아침판', privacy:'개인정보 결산', special:'특집', issue:'이슈 특집'};
function dayKey(d){ return d.slug ? d.date+'-'+d.slug : d.date }

var body = document.body;
var listEl = document.getElementById('list');
var qEl = document.getElementById('q');
var deckEl = document.getElementById('deck');
var dayCss = document.getElementById('daycss');
var pbar = document.getElementById('pbar');
var counter = document.getElementById('counter');
var dayLabel = document.getElementById('daylabel');

/* ---------- 인덱스 ---------- */
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}

function renderList(filter){
  var f = (filter||'').trim().toLowerCase();
  var shown = DAYS.filter(function(d){
    if(!f) return true;
    var hay = (d.date+' '+d.dow+' '+(d.slug||'')+' '+d.sub+' '+d.foot+' '+d.slides.join(' ')).toLowerCase();
    return hay.indexOf(f) !== -1;
  });
  if(!shown.length){ listEl.innerHTML = '<div class="ix-empty">일치하는 호가 없습니다.</div>'; return; }
  var out = [], lastMonth = '';
  shown.forEach(function(d){
    var p = d.date.split('-');
    var mk = p[0]+'-'+p[1];
    if(mk !== lastMonth){
      lastMonth = mk;
      out.push('<div class="ix-month">'+p[0]+' '+MONTH_KO[parseInt(p[1],10)-1]+'</div>');
    }
    var chips = (d.meta||[]).map(function(m){
      return '<span class="chip">'+esc(m.n)+' '+esc(m.l)+'</span>';
    }).join('');
    if(d.slug) chips = '<span class="chip" style="border-color:var(--accent);color:var(--accent)">'+esc(SLUG_KO[d.slug]||d.slug)+'</span>'+chips;
    out.push(
      '<button class="card" data-key="'+esc(dayKey(d))+'">'+
        '<div class="card-d"><div class="card-dd">'+p[1]+'.'+p[2]+'</div>'+
          '<div class="card-dow">'+esc(d.dow)+'요일</div></div>'+
        '<div class="card-body">'+
          '<div class="card-h">'+esc(d.sub||'보안 뉴스 다이제스트')+'</div>'+
          '<div class="card-sub">'+esc(d.foot)+'</div>'+
          (chips ? '<div class="card-meta">'+chips+'</div>' : '')+
        '</div>'+
        '<div class="card-go">›</div>'+
      '</button>');
  });
  listEl.innerHTML = out.join('');
}

listEl.addEventListener('click', function(e){
  var c = e.target.closest ? e.target.closest('.card') : null;
  if(c) location.hash = '#/'+c.dataset.key+'/1';
});
qEl.addEventListener('input', function(){ renderList(qEl.value) });

/* ---------- 덱 ---------- */
var W=430, H=932, cur=null, idx=0, slideEls=[], hinted=false;

function fit(){
  var vw = window.innerWidth||390, vh = window.innerHeight||844;
  deckEl.style.setProperty('--mb-scale', Math.min(vw/W, vh/H).toFixed(4));
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit,200) });

function openDay(key, n){
  var d = null;
  for(var i=0;i<DAYS.length;i++){ if(dayKey(DAYS[i])===key){ d=DAYS[i]; break } }
  if(!d) return showIndex();

  if(cur !== key){
    cur = key;
    dayCss.textContent = CSSPOOL[d.css] || '';
    slideEls.forEach(function(el){ el.remove() });
    slideEls = [];
    var frag = document.createElement('div');
    frag.innerHTML = d.slides.join('');
    Array.prototype.slice.call(frag.children).forEach(function(el){
      deckEl.appendChild(el);
      slideEls.push(el);
    });
    dayLabel.textContent = d.date.replace(/-/g,'.') + (d.slug ? ' · '+(SLUG_KO[d.slug]||d.slug) : '');
  }
  body.className = 'mode-deck';
  fit();
  show(n-1);
  if(!hinted){
    hinted = true;
    counter.textContent = '← 스와이프 →';
    setTimeout(function(){ show(idx) }, 2600);
  }
}

function show(i){
  if(!slideEls.length) return;
  i = Math.max(0, Math.min(slideEls.length-1, i));
  idx = i;
  slideEls.forEach(function(el,k){ el.classList.toggle('is-active', k===i) });
  pbar.style.width = ((i+1)/slideEls.length*100)+'%';
  counter.textContent = (i+1)+' / '+slideEls.length;
}

function go(delta){
  var next = idx + delta;
  if(next < 0 || next >= slideEls.length) return;
  setHash('#/'+cur+'/'+(next+1));
  show(next);
}

function showIndex(){
  cur = null;
  slideEls.forEach(function(el){ el.remove() });
  slideEls = [];
  dayCss.textContent = '';
  body.className = 'mode-index';
  window.scrollTo(0,0);
}

var suppress = false;
function setHash(h){
  if(location.hash === h) return;
  suppress = true;
  try{ history.replaceState(null,'',h) }catch(e){ location.hash = h }
  setTimeout(function(){ suppress = false }, 0);
}

document.getElementById('back').addEventListener('click', function(){
  suppress = true;
  try{ history.replaceState(null,'','#/') }catch(e){}
  setTimeout(function(){ suppress=false }, 0);
  showIndex();
});

Array.prototype.slice.call(document.querySelectorAll('.navzone')).forEach(function(z){
  z.addEventListener('click', function(){ go(parseInt(z.dataset.dir,10)) });
});

document.addEventListener('keydown', function(e){
  if(body.className !== 'mode-deck') return;
  if(e.key === 'ArrowRight' || e.key === ' ') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === 'Escape'){ location.hash = '#/' }
});

var sx=0, sy=0, tracking=false;
deckEl.addEventListener('touchstart', function(e){
  if(e.touches.length!==1) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
}, {passive:true});
deckEl.addEventListener('touchend', function(e){
  if(!tracking) return; tracking = false;
  var t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
}, {passive:true});

var mx = null;
deckEl.addEventListener('mousedown', function(e){ mx = e.clientX });
deckEl.addEventListener('mouseup', function(e){
  if(mx === null) return;
  var dx = e.clientX - mx; mx = null;
  if(Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

/* ---------- 라우팅 ---------- */
function route(){
  if(suppress) return;
  var m = /^#\/(\d{4}-\d{2}-\d{2}(?:-[A-Za-z0-9]+)?)(?:\/(\d+))?/.exec(location.hash||'');
  if(m) openDay(m[1], m[2] ? parseInt(m[2],10) : 1);
  else showIndex();
}
window.addEventListener('hashchange', route);

renderList('');
route();
})();
</script>
